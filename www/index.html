<style>
:root{--bg:#0B0E14;--card:#121824;--line:#1E293B;--text:#F1F5F9;--muted:#94A3B8;--em:#10B981;--bl:#3B82F6;--or:#F97316;--pu:#8B5CF6;--sub:#0f1522}
html.light{--bg:#F1F5F9;--card:#FFFFFF;--line:#E2E8F0;--text:#0F172A;--muted:#64748B;--sub:#F8FAFC}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:1.1rem}
.sub{background:var(--sub);border:1px solid var(--line);border-radius:.8rem}
.muted{color:var(--muted)}
.ic{width:1em;height:1em;display:inline-block;vertical-align:-.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.strong{color:var(--text)}
.line{border-color:var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border-radius:.9rem;padding:.7rem 1rem;font-weight:600;font-size:.9rem;transition:transform .1s,opacity .2s;cursor:pointer;border:1px solid transparent;user-select:none}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,#10B981,#3B82F6);color:#fff;box-shadow:0 6px 20px -6px rgba(16,185,129,.6)}
.btn-ghost{background:var(--sub);border-color:var(--line);color:var(--text)}
.btn-or{background:linear-gradient(135deg,#F97316,#EF4444);color:#fff}
.btn-pu{background:linear-gradient(135deg,#8B5CF6,#3B82F6);color:#fff}
.btn-sm{padding:.4rem .7rem;font-size:.78rem;border-radius:.7rem}
.input,select.input,textarea.input{background:var(--sub);border:1px solid var(--line);border-radius:.8rem;padding:.65rem .85rem;width:100%;color:var(--text);font-size:.95rem;outline:none}
.input:focus{border-color:var(--bl)}
select.input{appearance:none;-webkit-appearance:none}
.tab{display:none}.tab.active{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.nav-btn{color:var(--muted);transition:color .2s}
.nav-btn .ic{width:1.35rem;height:1.35rem}
.set-dot{width:.6rem;height:.6rem;border-radius:50%;background:var(--line);display:inline-block}
.set-dot.on{background:#10B981;box-shadow:0 0 6px #10B981}
.nav-btn.active{color:var(--em)}
.nav-btn.active .ic{filter:drop-shadow(0 0 8px rgba(16,185,129,.7))}
#header,#nav{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:28rem;z-index:40;background:rgba(11,14,20,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
html.light #header,html.light #nav{background:rgba(255,255,255,.85)}
#header{top:0;border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
#nav{bottom:0;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.chip{display:inline-flex;align-items:center;gap:.3rem;padding:.25rem .6rem;border-radius:999px;font-size:.75rem;font-weight:600;background:var(--sub);border:1px solid var(--line)}
.bar{height:.6rem;border-radius:999px;background:var(--sub);border:1px solid var(--line);overflow:hidden}
.bar>div{height:100%;border-radius:999px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--card);border:1px solid var(--line);border-bottom:none;border-radius:1.5rem 1.5rem 0 0;width:100%;max-width:28rem;max-height:92vh;overflow-y:auto;padding:1.25rem 1.25rem calc(1.25rem + env(safe-area-inset-bottom));animation:slideUp .28s cubic-bezier(.2,.9,.3,1)}
.modal.center{border-radius:1.5rem;border-bottom:1px solid var(--line);margin:auto 1rem;max-width:26rem}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.modal-bg.center{align-items:center}
.seg{display:flex;background:var(--sub);border:1px solid var(--line);border-radius:.8rem;padding:.2rem;gap:.2rem}
.seg button{flex:1;padding:.4rem .3rem;font-size:.75rem;font-weight:600;border-radius:.6rem;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.4)}
#toast-root{position:fixed;top:calc(4.5rem + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:.5rem;width:calc(100% - 2rem);max-width:26rem;pointer-events:none}
.toast{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--em);border-radius:.8rem;padding:.7rem .9rem;font-size:.85rem;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:toastIn .3s ease}
.toast.or{border-left-color:var(--or)}.toast.bl{border-left-color:var(--bl)}.toast.pu{border-left-color:var(--pu)}.toast.red{border-left-color:#EF4444}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:80}
.confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(900deg);opacity:0}}
.pop{animation:pop .7s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.shake{animation:shake .5s ease-in-out infinite}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg) scale(1.05)}75%{transform:rotate(8deg) scale(1.05)}}
.rays{position:absolute;inset:-60%;background:conic-gradient(from 0deg,transparent 0 10%,rgba(255,255,255,.08) 10% 20%,transparent 20% 30%,rgba(255,255,255,.08) 30% 40%,transparent 40% 50%,rgba(255,255,255,.08) 50% 60%,transparent 60% 70%,rgba(255,255,255,.08) 70% 80%,transparent 80% 90%,rgba(255,255,255,.08) 90% 100%);animation:spin 8s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.arena-hero{position:relative;overflow:hidden;border-radius:1.3rem;border:1px solid var(--line)}
.arena-hero .grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:22px 22px;mask-image:radial-gradient(circle at 50% 30%,#000 30%,transparent 80%)}
.locked{filter:grayscale(1) brightness(.55)}
.road-dot{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid var(--line);background:var(--sub)}
.m{fill:#2b3545;stroke:#0B0E14;stroke-width:.8;transition:fill .4s}
html.light .m{stroke:#fff}
.num{font-variant-numeric:tabular-nums}
.glow-em{box-shadow:0 0 24px -4px rgba(16,185,129,.55)}
.glow-or{box-shadow:0 0 24px -4px rgba(249,115,22,.55)}
.glow-pu{box-shadow:0 0 24px -4px rgba(139,92,246,.55)}
.hide-scroll::-webkit-scrollbar{display:none}
.hide-scroll{scrollbar-width:none}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.frame-anim{animation:hue 4s linear infinite}
.title-gold{background:linear-gradient(90deg,#FDE68A,#F59E0B,#FDE68A);-webkit-background-clip:text;background-clip:text;color:transparent}
.ring{position:relative;display:inline-block;border-radius:50%}
.spin{animation:spin 1s linear infinite}
.lvl-up{animation:lvlUp 1.2s ease}
@keyframes lvlUp{0%{transform:scale(1)}30%{transform:scale(1.25);filter:brightness(1.5)}100%{transform:scale(1)}}
.hero-up{animation:heroUp 1s cubic-bezier(.2,1.4,.4,1)}
@keyframes heroUp{0%{transform:translateY(40px) scale(.8);opacity:0}100%{transform:none;opacity:1}}
.skeleton{background:linear-gradient(90deg,var(--sub),var(--line),var(--sub));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
</style>
</head>

    const mo = new MutationObserver(muts => { if (!this.active()) return; let need = false; muts.forEach(m => { if (m.addedNodes.length) need = true; }); if (need) { clearTimeout(this._t); this._t = setTimeout(() => this.apply(document.body), 30); } });
    mo.observe(document.body, { childList: true, subtree: true });
  },
};

      },

      session: { loggedIn: false },

      ledger: [],
      meta: { savedAt: 0, remoteAt: null },
    };
  },
  migrate(s) {
    const d = this.defaults();
    const merge = (a, b) => { for (const k in a) if (b[k] === undefined) b[k] = a[k]; else if (a[k] && typeof a[k] === 'object' && !Array.isArray(a[k]) && b[k] && typeof b[k] === 'object') merge(a[k], b[k]); return b; };
    const out = merge(d, s);
    out.customExercises = (out.customExercises || []).map(c => typeof c === 'string' ? { name: c, muscles: [], bodyweight: false, mult: CONFIG.DEFAULT_MULT, boss: '' } : c);

  reset() { localStorage.removeItem(STORAGE_KEY); },
  export(state) { return JSON.stringify(state, null, 2); },
};

/* ------------------------------ UTIL -------------------------------- */
const U = {
  uid: () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36),
  pad: n => String(n).padStart(2, '0'),
  dayKey(d = new Date()) { d = new Date(d); return `${d.getFullYear()}-${U.pad(d.getMonth() + 1)}-${U.pad(d.getDate())}`; },
  parseDay(key) { const [y, m, d] = key.split('-').map(Number); return new Date(y, m - 1, d); },
  weekKey(d = new Date()) { d = new Date(d); const day = (d.getDay() + 6) % 7; d.setDate(d.getDate() - day); return U.dayKey(d); },
  monthKey(d = new Date()) { d = new Date(d); return `${d.getFullYear()}-${U.pad(d.getMonth() + 1)}`; },
  daysBetween(a, b) { return Math.round((U.parseDay(b) - U.parseDay(a)) / 864e5); },
  addDays(key, n) { const d = U.parseDay(key); d.setDate(d.getDate() + n); return U.dayKey(d); },
  fmtDate(key) { const d = U.parseDay(key); return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }); },
  today: () => U.dayKey(),
  clamp: (v, a, b) => Math.max(a, Math.min(b, v)),
  rnd: (a, b) => Math.floor(Math.random() * (b - a + 1)) + a,
  pick: arr => arr[Math.floor(Math.random() * arr.length)],
  esc: s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])),
  // единицы: в state всегда кг
  wUnit: () => S.profile.units,
  wEx(exName, kg) { return (U.exInfo(exName).bodyweight ? 'BW+' : '') + U.w(kg); },
  w(kg, digits = 1) { const v = S.profile.units === 'lbs' ? kg * 2.20462 : kg; return Number(v.toFixed(digits)).toString(); },
  toKg(v) { v = parseFloat(v); if (isNaN(v)) return NaN; return S.profile.units === 'lbs' ? v / 2.20462 : v; },
  fmtTime(ms) { if (ms <= 0) return '00:00'; const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60; return h > 0 ? `${h}ч ${U.pad(m)}м` : `${U.pad(m)}:${U.pad(sec)}`; },
  normalizeExercise(name, strict = false) {
    const n = String(name || '').trim().toLowerCase();
    if (!n) return 'Unknown';
    if (strict) { for (const key in CONFIG.EXERCISES) { const ex = CONFIG.EXERCISES[key]; if (key.toLowerCase() === n || ex.ru.toLowerCase() === n || ex.aliases.includes(n)) return key; } return String(name).trim(); }
    for (const key in CONFIG.EXERCISES) {
      const ex = CONFIG.EXERCISES[key];
      if (key.toLowerCase() === n || ex.ru.toLowerCase() === n) return key;
    }
    for (const key in CONFIG.EXERCISES) {
      const ex = CONFIG.EXERCISES[key];
      if (ex.aliases.some(a => n === a || n.includes(a))) return key;
    }
    return String(name).trim();
  },
  rmLabel(l) { return l.rmCategory === 'CUSTOM' ? `${l.reps} повт.` : l.rmCategory; },
  customEx(name) { return (S.customExercises || []).find(c => c.name === name) || null; },
  exInfo(name) { if (CONFIG.EXERCISES[name]) return CONFIG.EXERCISES[name]; const c = U.customEx(name); return c ? { ru: c.name, mult: c.mult || CONFIG.DEFAULT_MULT, muscles: c.muscles || [], bodyweight: !!c.bodyweight, boss: c.boss || '', aliases: [], custom: true } : { ru: name, mult: CONFIG.DEFAULT_MULT, muscles: [], aliases: [] }; },
  exRu(name) { const lang = (S.profile.lang || 'ru'); if (lang !== 'ru' && CONFIG.EXERCISES[name]) return name; return U.exInfo(name).ru; },
  shopItem(id) { return CONFIG.SHOP.find(i => i.id === id); },
};

/* ------------------------------ CALC -------------------------------- */
const Calc = {
  epley(w, reps) { return reps <= 1 ? w : w * (1 + reps / 30); },
  e1rm(weight, rmCat, reps) { return Calc.epley(weight, rmCat === 'CUSTOM' ? (reps || 1) : (CONFIG.RM_REPS[rmCat] || 1)); },
  powerScore(e1rm, bw, mult) { return bw > 0 ? mult * (e1rm / bw) * 100 : 0; },
  arenaIdxByTrophies(t) { let idx = 0; CONFIG.ARENAS.forEach((a, i) => { if (t >= a.min) idx = i; }); return idx; },
  arena(idx = S.game.arenaIdx) { return CONFIG.ARENAS[U.clamp(idx, 0, CONFIG.ARENAS.length - 1)]; },
  nextArena(idx = S.game.arenaIdx) { return CONFIG.ARENAS[idx + 1] || null; },
  arenaFloor(idx = S.game.arenaIdx) { return Calc.arena(idx).min; },
  level(xp) { return Math.floor(Math.sqrt(xp / 100)) + 1; },
  xpForLevel(l) { return (l - 1) * (l - 1) * 100; },
  validLifts() { return S.lifts.filter(l => !l.flagged); },
  bestE1rm(exName, lifts = Calc.validLifts()) { return lifts.filter(l => l.exerciseName === exName).reduce((m, l) => Math.max(m, l.e1rm), 0); },
  bestLift(exName, lifts = Calc.validLifts()) { return lifts.filter(l => l.exerciseName === exName).sort((a, b) => b.e1rm - a.e1rm)[0] || null; },
  exerciseNames() { const set = new Set(Object.keys(CONFIG.EXERCISES)); (S.customExercises || []).forEach(c => set.add(c.name)); S.lifts.forEach(l => set.add(l.exerciseName)); return [...set]; },
  // план на день недели (0 = Пн)
  weekday(day = U.today()) { return (U.parseDay(day).getDay() + 6) % 7; },
  planFor(day = U.today()) { return S.program.days[Calc.weekday(day)] || null; },
  plannedExercisesDone(day = U.today()) { const p = Calc.planFor(day); if (!p) return []; const target = p.sets || 3, lifts = Calc.liftsOn(day); return p.exercises.map(e => { const sets = lifts.filter(l => l.exerciseName === e).length; return { name: e, sets, target, done: sets >= target }; }); },
  rmByReps(reps) { reps = parseInt(reps) || 1; return reps <= 1 ? '1RM' : reps <= 3 ? '2RM' : reps <= 5 ? '4RM' : 'CUSTOM'; },
  lastLift(exName) { return S.lifts.filter(l => l.exerciseName === exName).sort((a, b) => b.ts - a.ts)[0] || null; },
  bossReq(arenaIdx = S.game.arenaIdx) {
    const a = Calc.arena(arenaIdx); if (!a.boss) return null;
    const f = S.profile.sex === 'f' ? CONFIG.FEMALE_BOSS_FACTOR : 1, bw = S.profile.bodyweight || 70;
    const names = { bench: 'Жим лёжа', squat: 'Присед', deadlift: 'Становая тяга' };
    const items = Object.keys(a.boss).map(k => {
      const exs = Calc.exerciseNames().filter(e => U.exInfo(e).boss === k), exName = exs[0];
      const need = a.boss[k] * f * bw, have = Math.max(0, ...exs.map(e => Calc.bestE1rm(e)));
      return { key: k, exName, name: names[k], ratio: +(a.boss[k] * f).toFixed(2), need, have, ok: have >= need, pct: U.clamp(have / need, 0, 1) };
    });
    return { arena: a, items, met: items.every(i => i.ok) };
  },
  bossMet(arenaIdx = S.game.arenaIdx) { const b = Calc.bossReq(arenaIdx); return !b || b.met; },
  isPR(lift) { // новый рекорд: e1RM выше лучшего подтверждённого по этому упражнению
    const prev = Calc.validLifts().filter(l => l.exerciseName === lift.exerciseName && l.id !== lift.id);
    if (!prev.length) return lift.e1rm > 0; // первый лог — тоже рекорд
    return lift.e1rm > Math.max(...prev.map(l => l.e1rm));
  },
  isSuspicious(lift) { // античит: скачок e1RM >15% от лучшего за раз
    const best = Calc.bestE1rm(lift.exerciseName, Calc.validLifts().filter(l => l.id !== lift.id));
    return best > 0 && lift.e1rm > best * (1 + CONFIG.CHEAT_JUMP);
  },
  liftsOn(day) { return S.lifts.filter(l => l.date === day); },
  distinctExercises(day) { return new Set(Calc.liftsOn(day).map(l => l.exerciseName)).size; },
  isWorkoutDay(day) { return Calc.distinctExercises(day) >= CONFIG.WORKOUT_MIN_EXERCISES; },
  workoutsInWeek(weekKey) { return S.game.countedWorkoutDays.filter(d => U.weekKey(U.parseDay(d)) === weekKey).length; },
  streak() { // серия: тренировки с разрывом не более 2 дней, считая назад от последней
    const days = [...new Set([...S.game.countedWorkoutDays, ...(S.game.frozenDays || [])])].sort(); if (!days.length) return { count: 0, active: false };
    let count = 0; for (let i = days.length - 1; i >= 0; i--) { if (S.game.countedWorkoutDays.includes(days[i])) count++; if (i > 0 && U.daysBetween(days[i - 1], days[i]) > 2) break; }
    const active = U.daysBetween(days[days.length - 1], U.today()) <= 2;
    return { count: active ? count : 0, active, last: days[days.length - 1] };
  },
  nutritionStreak() {
    const days = [...new Set(S.nutrition.log.map(f => f.date))].sort(); if (!days.length) return 0;
    if (U.daysBetween(days[days.length - 1], U.today()) > 1) return 0;
    let c = 1; for (let i = days.length - 1; i > 0; i--) { if (U.daysBetween(days[i - 1], days[i]) === 1) c++; else break; }
    return c;
  },
  muscleLoad30() { // нагрузка по мышечным группам за 30 дней, 0..1
    const from = U.addDays(U.today(), -30), load = {}; Object.keys(CONFIG.MUSCLES).forEach(m => load[m] = 0);
    S.lifts.filter(l => l.date >= from).forEach(l => { const ms = U.exInfo(l.exerciseName).muscles; ms.forEach((m, i) => load[m] += i === 0 ? 1 : 0.5); });
    const max = Math.max(1, ...Object.values(load));
    const out = {}; for (const m in load) out[m] = load[m] / max;
    return { norm: out, raw: load };
  },
  radar() { // навыки 1..25
    const bw = S.profile.bodyweight || 70, lifts = Calc.validLifts();
    const bestPS = Calc.exerciseNames().map(e => Calc.powerScore(Calc.bestE1rm(e, lifts), bw, U.exInfo(e).mult)).sort((a, b) => b - a).slice(0, 3);
    const avgPS = bestPS.length ? bestPS.reduce((a, b) => a + b, 0) / bestPS.length : 0;
    const strength = U.clamp(Math.round(avgPS / 12), 1, 25);
    const nutrition = U.clamp(Math.round(S.game.nutritionDays.length / 2 + Calc.nutritionStreak()), 1, 25);
    const wk = [0, 1, 2, 3].map(i => Calc.workoutsInWeek(U.weekKey(U.parseDay(U.addDays(U.today(), -7 * i)))));
    const discipline = U.clamp(Math.round(wk.reduce((a, b) => a + b, 0) * 2 + Calc.streak().count), 1, 25);
    const over = wk.filter(w => w > 5).length;
    const sl = Calc.sleepWeek().filter(x => x.score != null), sleepAvgScore = sl.length ? sl.reduce((a, x) => a + x.score, 0) / sl.length : 60;
    const recovery = U.clamp(Math.round(sleepAvgScore / 5 - over * 4 + Math.min(3, S.game.countedWorkoutDays.length / 6)), 1, 25);
    return { strength, nutrition, recovery, discipline };
  },
  /* --- сон --- */
  sleepFor(day = U.today()) { return S.health.sleep.find(x => x.date === day) || null; },
  sleepNorm() { const age = S.profile.age || 20; return age < 18 ? [8, 10] : [7, 9]; },
  sleepScore(hours) { // 0..100 только по часам: норма = 100, недосып −22/ч, пересып −20/ч
    const [lo, hi] = Calc.sleepNorm(); let s;
    if (hours >= lo && hours <= hi) s = 100; else if (hours < lo) s = 100 - (lo - hours) * 22; else s = 100 - (hours - hi) * 20;
    return U.clamp(Math.round(s), 0, 100);
  },
  sleepGrade(score, hours) { // совет по часам, а не по самооценке
    const [lo, hi] = Calc.sleepNorm();
    if (hours != null && hours > hi + 0.5) return { label: T('sl_over'), color: '#F97316', tip: `Спал ${hours} ч при норме ${lo}–${hi}. Пересып тоже бьёт по энергии: вставай раньше, ложись в одно время, днём больше движения и света.` };
    if (score >= 85) return { label: T('sl_great'), color: '#10B981', tip: 'Восстановление на максимуме. Можно работать тяжело.' };
    if (score >= 65) return { label: T('sl_good'), color: '#3B82F6', tip: `Почти норма (${lo}–${hi} ч). Ложись на 30 минут раньше.` };
    if (score >= 40) return { label: T('sl_low'), color: '#F97316', tip: 'Недосып снижает силу и рост мышц. Сегодня без рекордов, лёгкая тренировка.' };
    return { label: T('sl_bad'), color: '#EF4444', tip: 'Сон важнее тренировки: сегодня восстановись, в зал завтра.' };
  },
  sleepWeek() { return [6, 5, 4, 3, 2, 1, 0].map(i => { const d = U.addDays(U.today(), -i); const r = Calc.sleepFor(d); return { date: d, hours: r ? r.hours : null, score: r ? Calc.sleepScore(r.hours) : null }; }); },
  sleepAvg(days = 7) { const xs = Calc.sleepWeek().filter(x => x.hours != null); return xs.length ? xs.reduce((a, x) => a + x.hours, 0) / xs.length : null; },
  nutritionToday(day = U.today()) {
    const items = S.nutrition.log.filter(f => f.date === day);
    const t = { cals: 0, protein: 0, carbs: 0, fat: 0 }; items.forEach(f => { t.cals += +f.cals || 0; t.protein += +f.protein || 0; t.carbs += +f.carbs || 0; t.fat += +f.fat || 0; });
    return { items, total: t };
  },
  defaultGoals() {
    const p = S.profile, bw = p.bodyweight || 70, h = p.height || 175, age = p.age || 25;
    const bmr = 10 * bw + 6.25 * h - 5 * age + (p.sex === 'f' ? -161 : 5);
    const cals = Math.round(bmr * 1.5 / 10) * 10; // поддержание, без дефицита по умолчанию
    const protein = Math.round(bw * 1.8), fat = Math.round(cals * 0.27 / 9), carbs = Math.round((cals - protein * 4 - fat * 9) / 4);
    return { cals, protein, carbs, fat };
  },
  nutritionGoalMet(day = U.today()) {
    const g = S.nutrition.goals || Calc.defaultGoals(), { items, total } = Calc.nutritionToday(day);
    return items.length > 0 && total.cals >= g.cals * 0.85 && total.cals <= g.cals * 1.1 && total.protein >= g.protein * 0.8;
  },
  weekLedger(weekKey = U.weekKey()) { return S.ledger.filter(e => e.type === 'trophy' && U.weekKey(new Date(e.ts)) === weekKey).reduce((a, e) => a + e.delta, 0); },
  // счёт клана: среднее на активного × (0.5 + 0.5 × доля участвующих) — большой клан не выигрывает автоматом
  clanScore(members) {
    const act = members.filter(m => (m.week.workouts || 0) > 0);
    if (!act.length) return 0;
    const total = act.reduce((a, m) => a + Calc.memberActivity(m), 0);
    const participation = act.length / members.length;
    return Math.round((total / act.length) * (0.5 + 0.5 * participation));
  },
  memberActivity(m) { return (m.week.workouts || 0) * 15 + (m.week.prs || 0) * 25 + (m.week.streak || 0) * 2; },
  myWeek() {
    const wk = U.weekKey();
    return { workouts: Calc.workoutsInWeek(wk), prs: S.lifts.filter(l => l.isPR && !l.flagged && U.weekKey(U.parseDay(l.date)) === wk).length, streak: Calc.streak().count };
  },
};

/* ------------------------------ GAME -------------------------------- */
const Game = {
  events: [], // очередь анимаций: {type:'pr'|'arena'|'chest'|'level', data}
  ledger(type, delta, note) { S.ledger.push({ ts: Date.now(), type, delta, note }); if (S.ledger.length > 2000) S.ledger.splice(0, S.ledger.length - 2000); },
  addXP(n, note) {
    const before = Calc.level(S.game.xp); S.game.xp += n; this.ledger('xp', n, note);
    const after = Calc.level(S.game.xp); if (after > before) this.events.push({ type: 'level', data: { level: after } });
  },
  addCoins(n, note) { S.game.coins = Math.max(0, S.game.coins + n); this.ledger('coin', n, note); },
  addTrophies(n, note) {
    const g = S.game, next = Calc.nextArena(g.arenaIdx);
    let t = g.trophies + n;
    // босс арены: кубки останавливаются на пороге следующей арены, пока условие не выполнено
    if (n > 0 && next && !Calc.bossMet(g.arenaIdx)) t = Math.min(t, next.min);
    t = Math.max(Calc.arenaFloor(g.arenaIdx), t);
    const delta = t - g.trophies; g.trophies = t;
    if (delta !== 0) this.ledger('trophy', delta, note);
    this.checkArenaUp();
    return delta;
  },
  checkArenaUp() {
    const g = S.game;
    while (true) {
      const next = Calc.nextArena(g.arenaIdx);
      if (!next || g.trophies < next.min || !Calc.bossMet(g.arenaIdx)) break;
      g.arenaIdx++;
      const r = next.reward || {};
      if (r.coins) this.addCoins(r.coins, `Арена: ${next.name}`);
      if (r.item && !S.profile.owned.includes(r.item)) S.profile.owned.push(r.item);
      this.events.push({ type: 'arena', data: { arena: next, reward: r } });
    }
  },
  /* --- тренировки --- */
  logLift({ exerciseName, weight, rmCategory, date, reps }) {
    exerciseName = U.normalizeExercise(exerciseName);
    rmCategory = CONFIG.RM_CATS.includes(rmCategory) ? rmCategory : '1RM';
    reps = rmCategory === 'CUSTOM' ? U.clamp(parseInt(reps) || 1, 1, 50) : CONFIG.RM_REPS[rmCategory];
    date = date && /^\d{4}-\d{2}-\d{2}$/.test(date) && date <= U.today() ? date : U.today();
    const lift = { id: U.uid(), exerciseName, weight: +weight, rmCategory, reps, e1rm: +Calc.e1rm(+weight + (U.exInfo(exerciseName).bodyweight ? (S.profile.bodyweight || 70) : 0), rmCategory, reps).toFixed(1), date, ts: Date.now(), isPR: false, flagged: false, verified: true };
    lift.flagged = Calc.isSuspicious(lift);
    if (lift.flagged) { lift.verified = false; }
    else if (Calc.isPR(lift)) {
      lift.isPR = true;
      S.lifts.push(lift);
      const prBonus = this.boosts().pr50_until > Date.now() ? Math.round(CONFIG.TROPHY.PR * 1.5) : CONFIG.TROPHY.PR;
      this.addTrophies(prBonus, `PR: ${U.exRu(exerciseName)}${prBonus > CONFIG.TROPHY.PR ? ' (+50%)' : ''}`);
      this.addXP(CONFIG.XP.PR, 'PR');
      this.events.push({ type: 'pr', data: { lift } });
    }
    if (!S.lifts.includes(lift)) S.lifts.push(lift);
    this.addXP(CONFIG.XP.SET, 'Подход');
    this.processWorkoutDay(date);
    this.evaluateQuests();
    save();
    return lift;
  },
  deleteLift(id) { S.lifts = S.lifts.filter(l => l.id !== id); save(); },
  processWorkoutDay(day) {
    const g = S.game;
    if (!Calc.isWorkoutDay(day) || g.countedWorkoutDays.includes(day)) return;
    g.countedWorkoutDays.push(day);
    if (!g.lastWorkoutDay || day > g.lastWorkoutDay) g.lastWorkoutDay = day;
    g.decayAppliedWeeks = 0;
    const b = this.boosts(); let wt = CONFIG.TROPHY.WORKOUT; if (b.x2_workout > 0) { wt *= 2; b.x2_workout--; this.events.push({ type: 'toast', data: { msg: 'Буст ×2: тренировка дала ' + wt + ' кубков', cls: 'or' } }); }
    this.addTrophies(wt, 'Тренировка' + (wt > CONFIG.TROPHY.WORKOUT ? ' ×2' : ''));
    this.addXP(CONFIG.XP.WORKOUT, 'Тренировка');
    const wk = U.weekKey(U.parseDay(day));
    if (Calc.workoutsInWeek(wk) >= CONFIG.WEEKLY_BONUS_WORKOUTS && !g.weeklyBonusWeeks.includes(wk)) {
      g.weeklyBonusWeeks.push(wk);
      this.addTrophies(CONFIG.TROPHY.WEEKLY_BONUS, 'Бонус: 3 тренировки за неделю');
      this.events.push({ type: 'toast', data: { msg: `+${CONFIG.TROPHY.WEEKLY_BONUS} кубков: 3 тренировки за неделю!`, cls: 'or' } });
    }
  },
  /* --- decay --- */
  applyDecay() {
    const g = S.game; if (!g.lastWorkoutDay) return;
    if (this.boosts().shield_until > Date.now()) return; // щит
    const days = U.daysBetween(g.lastWorkoutDay, U.today());
    if (days < CONFIG.TROPHY.DECAY_AFTER_DAYS) return;
    const weeks = Math.floor((days - CONFIG.TROPHY.DECAY_AFTER_DAYS) / 7) + 1, toApply = weeks - (g.decayAppliedWeeks || 0);
    if (toApply <= 0) return;
    const floor = Calc.arenaFloor(), before = g.trophies;
    g.trophies = Math.max(floor, g.trophies - CONFIG.TROPHY.DECAY_PER_WEEK * toApply);
    g.decayAppliedWeeks = weeks;
    if (g.trophies !== before) this.ledger('trophy', g.trophies - before, 'Пауза в тренировках');
  },
  /* --- сезоны (структура, по умолчанию выключено) --- */
  applySeason() {
    const s = S.game.season; if (!s.enabled) return;
    const id = U.monthKey(); if (s.id === id) return;
    if (s.id) {
      const floor = Calc.arenaFloor(), g = S.game, before = g.trophies;
      const reward = (g.arenaIdx + 1) * CONFIG.SEASON.REWARD_PER_ARENA;
      g.trophies = Math.max(floor, Math.round(floor + (g.trophies - floor) * s.keepRatio));
      s.history.push({ id: s.id, arenaIdx: g.arenaIdx, trophies: before, reward });
      this.addCoins(reward, `Сезон ${s.id}`);
      this.ledger('trophy', g.trophies - before, `Сброс сезона ${s.id}`);
    }
    s.id = id; s.startedAt = Date.now();
  },
  /* --- квесты --- */
  ensureQuests() {
    const q = S.game.quests, wk = U.weekKey();
    if (q.weekly.key !== wk) q.weekly = { key: wk, items: CONFIG.QUESTS.weekly.map(d => ({ id: d.id, done: false })) };
  },
  questProgress(id) {
    const wk = U.weekKey();
    switch (id) {
      case 'w_3': return Calc.workoutsInWeek(wk);
      case 'w_pr': return S.lifts.filter(l => l.isPR && !l.flagged && U.weekKey(U.parseDay(l.date)) === wk).length;
      case 'w_nut': return S.game.nutritionDays.filter(d => U.weekKey(U.parseDay(d)) === wk).length;
    }

  },
  questList(kind) {
    this.ensureQuests();
    return CONFIG.QUESTS[kind].map(def => { const st = S.game.quests[kind].items.find(i => i.id === def.id) || { done: false }; const p = this.questProgress(def.id); return { ...def, done: st.done, progress: Math.min(p, def.target) }; });
  },
  evaluateQuests() {
    this.ensureQuests();
    ['weekly'].forEach(kind => {
      CONFIG.QUESTS[kind].forEach(def => {
        const st = S.game.quests[kind].items.find(i => i.id === def.id);
        if (st && !st.done && this.questProgress(def.id) >= def.target) {
          st.done = true;
          this.addTrophies(def.reward, `Квест: ${def.title}`);
          this.addXP(CONFIG.XP.QUEST, 'Квест');
          this.events.push({ type: 'toast', data: { msg: `Квест выполнен: ${def.title} (+${def.reward} <svg class="ic text-amber-400"><use href="#fa-trophy"/></svg>)`, cls: 'pu' } });

  logFood(items, date = U.today()) {

    this.evaluateNutrition(date); this.evaluateQuests(); save();
  },
  deleteFood(id) { S.nutrition.log = S.nutrition.log.filter(f => f.id !== id); save(); },
  evaluateNutrition(day = U.today()) {

  },
  /* --- расписание --- */
  savePlan(weekday, name, exercises, sets = 3) {

    if (!exercises.length) delete S.program.days[weekday];
    else S.program.days[weekday] = { name: (name || '').trim().slice(0, 30) || 'Тренировка', exercises, sets: U.clamp(parseInt(sets) || 3, 1, 10) };

  },
  // эвристика по названию: какие мышцы, свой ли вес, босс-движение
  guessExercise(name) {
    const n = String(name || '').toLowerCase();
    const norm = U.normalizeExercise(name, true); if (CONFIG.EXERCISES[norm]) { const e = CONFIG.EXERCISES[norm]; return { muscles: [...e.muscles], bodyweight: !!e.bodyweight, mult: e.mult, boss: e.boss || '' }; }
    const KW = { back: ['тяг', 'подтяг', 'греб', 'row', 'pull', 'lat', 'спин'], chest: ['жим', 'отжим', 'груд', 'bench', 'push', 'брусь', 'сведен', 'бабочк', 'fly'], shoulders: ['плеч', 'мах', 'армейск', 'overhead', 'delt', 'разведен', 'протяжк', 'shrug', 'шраг'], triceps: ['трицепс', 'брусь', 'француз', 'отжим', 'разгибание рук', 'tricep', 'блок вниз'], biceps: ['бицепс', 'сгибание рук', 'curl', 'подтяг', 'молот'], quads: ['присед', 'выпад', 'ног', 'squat', 'leg', 'разгибание ног', 'платформ', 'степ'], hamstrings: ['румынск', 'бицепс бедра', 'сгибание ног', 'мертв', 'становая', 'good morning', 'наклон'], glutes: ['ягодич', 'мост', 'присед', 'становая', 'hip', 'выпад', 'отведение'], abs: ['пресс', 'планк', 'скруч', 'abs', 'core', 'подъем ног', 'подъём ног', 'колес'], calves: ['икр', 'носк', 'calf', 'голен'] };
    const muscles = Object.keys(KW).filter(m => KW[m].some(k => n.includes(k)));
    const bodyweight = ['подтяг', 'отжим', 'брусь', 'планк', 'пресс', 'скруч', 'выпад', 'бёрпи', 'берпи', 'pull-up', 'push-up', 'dip'].some(k => n.includes(k));
    const boss = /жим.*(леж|лёж)|bench/.test(n) ? 'bench' : /присед|squat/.test(n) && !/болгар|сплит|пистолет/.test(n) ? 'squat' : /становая|deadlift/.test(n) && !/румын/.test(n) ? 'deadlift' : '';
    const mult = muscles.length >= 3 ? 1.2 : muscles.length === 2 ? 1.5 : muscles.length === 1 && ['biceps', 'triceps', 'shoulders', 'calves', 'abs'].includes(muscles[0]) ? 3.0 : 1.5;
    return { muscles, bodyweight, mult, boss };
  },
  saveCustomExercise(obj, origName = null) {
    const name = String(obj.name || '').trim().slice(0, 40); if (!name) return null;
    const norm = U.normalizeExercise(name, true); if (CONFIG.EXERCISES[norm]) return norm; // уже есть во встроенных
    const rec = { name, muscles: (obj.muscles || []).filter(m => CONFIG.MUSCLES[m]), bodyweight: !!obj.bodyweight, mult: U.clamp(+obj.mult || CONFIG.DEFAULT_MULT, 0.3, 5), boss: ['bench', 'squat', 'deadlift'].includes(obj.boss) ? obj.boss : '' };
    const i = S.customExercises.findIndex(c => c.name === (origName || name));
    if (i >= 0) S.customExercises[i] = rec; else S.customExercises.push(rec);
    if (origName && origName !== name) { // переименование: обновить логи и программу
      S.lifts.forEach(l => { if (l.exerciseName === origName) l.exerciseName = name; });
      Object.values(S.program.days).forEach(d => d.exercises = d.exercises.map(e => e === origName ? name : e));
    }
    save(); return name;
  },
  removeCustomExercise(name) { S.customExercises = S.customExercises.filter(c => c.name !== name); Object.values(S.program.days).forEach(d => d.exercises = d.exercises.filter(e => e !== name)); save(); },
  /* --- сон --- */
  logSleep(hours, date = U.today()) {
    hours = U.clamp(Math.round(+hours * 2) / 2, 0, 16);
    const i = S.health.sleep.findIndex(x => x.date === date);
    const rec = { date, hours, ts: Date.now() };
    if (i >= 0) S.health.sleep[i] = rec; else { S.health.sleep.push(rec); this.addXP(5, 'Сон'); }
    if (S.health.sleep.length > 400) S.health.sleep.splice(0, S.health.sleep.length - 400);
    save(); return rec;
  },
  /* --- бусты и защита (покупаются в магазине) --- */
  boosts() { return S.game.boosts || (S.game.boosts = { x2_workout: 0, pr50_until: 0, freeze: 0, shield_until: 0 }); },
  activeBoosts() {
    const b = this.boosts(), now = Date.now(), out = [];
    if (b.x2_workout > 0) out.push({ id: 'boost_x2', label: `×2 кубки за тренировку (${b.x2_workout})`, icon: 'fa-bolt' });
    if (b.pr50_until > now) out.push({ id: 'boost_pr50', label: `+50% к PR до ${U.fmtDate(U.dayKey(new Date(b.pr50_until)))}`, icon: 'fa-crown' });
    if (b.freeze > 0) out.push({ id: 'boost_freeze', label: `Заморозка серии (${b.freeze})`, icon: 'fa-hourglass' });
    if (b.shield_until > now) out.push({ id: 'boost_shield', label: `Щит от потери кубков до ${U.fmtDate(U.dayKey(new Date(b.shield_until)))}`, icon: 'fa-shield-halved' });
    return out;
  },
  buyBoost(id) {
    const it = U.shopItem(id), b = this.boosts(); if (!it) return { error: 'Нет такого товара' };
    if (S.game.coins < it.price) return { error: 'Не хватает монет' };
    const now = Date.now(), week = 7 * 864e5;
    if (id === 'boost_x2') { if (b.x2_workout >= 2) return { error: 'Максимум 2 заряда' }; b.x2_workout++; }
    else if (id === 'boost_pr50') { if (b.pr50_until > now) return { error: 'Буст уже активен' }; b.pr50_until = now + week; }
    else if (id === 'boost_freeze') { if (b.freeze >= 2) return { error: 'Максимум 2 заморозки' }; b.freeze++; }
    else if (id === 'boost_shield') { if (b.shield_until > now) return { error: 'Щит уже активен' }; b.shield_until = now + week; }
    else return { error: 'Это не буст' };
    this.addCoins(-it.price, `Магазин: ${it.name}`); save(); return { ok: true };
  },
  // заморозка серии: если прошло ровно 3 дня с последней тренировки, тратим заряд и «закрываем» вчерашний день
  applyFreeze() {
    const b = this.boosts(), g = S.game; if (!b.freeze || !g.lastWorkoutDay) return;
    const gap = U.daysBetween(g.lastWorkoutDay, U.today());
    if (gap === 3) { const d = U.addDays(U.today(), -1); g.frozenDays = g.frozenDays || []; if (!g.frozenDays.includes(d)) { g.frozenDays.push(d); b.freeze--; this.events.push({ type: 'toast', data: { msg: 'Заморозка серии сработала: серия сохранена', cls: 'bl' } }); } }
  },
  setCustomTitle(text) { text = String(text || '').trim().slice(0, 18); if (!text) return false; S.profile.customTitle = text; if (!S.profile.owned.includes('title_custom')) return false; S.profile.avatar.title = 'title_custom'; save(); return true; },
  /* --- аккаунт (локально; методы повторяют Supabase Auth: signUp / signIn / signOut) --- */
  async hash(pass, salt) {
    const data = new TextEncoder().encode(salt + ':' + pass);
    if (crypto && crypto.subtle) { const h = await crypto.subtle.digest('SHA-256', data); return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join(''); }
    let x = 0; for (const c of data) x = (x * 31 + c) >>> 0; return 'w' + x.toString(16);
  },
  async signUp(email, pass, nick) {
    email = String(email || '').trim().toLowerCase(); if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return { error: 'Некорректный email' };
    if (!pass || pass.length < 6) return { error: 'Пароль минимум 6 символов' };
    if (Net.ready) { try { return await Net.signUp(email, pass, nick); } catch (e) { return { error: Net.err(e) }; } }
    if (S.account && S.account.email) return { error: 'На этом устройстве уже есть аккаунт: войди' };
    const salt = U.uid(); S.account = { email, salt, passHash: await this.hash(pass, salt), createdAt: Date.now(), uid: 'local_' + U.uid() };
    S.session = { loggedIn: true, at: Date.now() }; save(); return { ok: true };
  },
  async signIn(email, pass) {
    email = String(email || '').trim().toLowerCase();
    if (Net.ready) { try { return await Net.signIn(email, pass); } catch (e) { return { error: Net.err(e) }; } }
    const a = S.account;
    if (!a || !a.email) return { error: 'Аккаунт не найден: зарегистрируйся' };
    if (a.email !== email) return { error: 'Email не совпадает с аккаунтом на этом устройстве' };
    if (await this.hash(pass, a.salt) !== a.passHash) return { error: 'Неверный пароль' };
    S.session = { loggedIn: true, at: Date.now() }; save(); return { ok: true };
  },
  async signOut() { if (Net.ready) await Net.signOut(); S.session = { loggedIn: false }; save(); },
  /* --- магазин --- */
  buy(id) {
    const it = U.shopItem(id); if (!it || S.profile.owned.includes(id)) return false;
    if (S.game.coins < it.price) return false;
    this.addCoins(-it.price, `Магазин: ${it.name}`); S.profile.owned.push(id); this.equip(id); return true;
  },
  equip(id) { const it = U.shopItem(id); if (!it || !S.profile.owned.includes(id)) return; S.profile.avatar[it.type] = S.profile.avatar[it.type] === id && it.type !== 'outfit' ? null : id; save(); },
  /* --- старт --- */
  boot() { this.ensureQuests(); this.applySeason(); this.applyFreeze(); this.applyDecay(); this.checkArenaUp(); ClanService.resolveBattle(); ClanService.resolveDuel(); this.evaluateQuests(); save(); },
};

/* ------------------------------ GEMINI ------------------------------ */
const Gemini = {
  key: () => CONFIG.GEMINI_KEY,
  hasKey: () => !!CONFIG.GEMINI_KEY && !/^__/.test(CONFIG.GEMINI_KEY),
  model: () => (S.profile.geminiModel || CONFIG.GEMINI_MODEL_DEFAULT).trim(),
  SCHEMA_WORKOUT: { type: 'ARRAY', items: { type: 'OBJECT', properties: { exerciseName: { type: 'STRING' }, weight: { type: 'NUMBER' }, rmCategory: { type: 'STRING', enum: ['1RM', '2RM', '4RM', 'CUSTOM'] }, reps: { type: 'NUMBER' }, date: { type: 'STRING' } }, required: ['exerciseName', 'weight', 'rmCategory', 'reps', 'date'] } },
  SCHEMA_FOOD: { type: 'ARRAY', items: { type: 'OBJECT', properties: { name: { type: 'STRING' }, cals: { type: 'NUMBER' }, protein: { type: 'NUMBER' }, carbs: { type: 'NUMBER' }, fat: { type: 'NUMBER' } }, required: ['name', 'cals', 'protein', 'carbs', 'fat'] } },
  async call(parts, schema) {
    if (!this.hasKey()) throw new Error('Ключ Gemini не задан.');
    const body = { contents: [{ role: 'user', parts }], generationConfig: { responseMimeType: 'application/json', responseSchema: schema } };
    const models = [this.model(), ...CONFIG.GEMINI_FALLBACKS.filter(m => m !== this.model())];
    let lastErr = null;
    for (const model of models) {
      let timer = null;
      try {
        // без AbortSignal: в некоторых WebView опции fetch клонируются и сигнал ломает запрос («object cannot be cloned»)
        const res = await Promise.race([
          fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(this.key())}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }),
          new Promise((_, rej) => { timer = setTimeout(() => rej(Object.assign(new Error('timeout'), { name: 'AbortError' })), 25000); }),
        ]);
        clearTimeout(timer);
        if (!res.ok) {
          let msg = `Gemini ${res.status}`; try { const j = await res.json(); msg = j.error?.message || msg; } catch (_) {}
          lastErr = new Error(msg);
          if ([404, 429, 500, 503].includes(res.status)) continue; // модель недоступна/перегружена → следующая
          throw lastErr;
        }
        const j = await res.json();
        const text = j.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('') || '[]';
        try { return JSON.parse(text); } catch (_) { const m = text.match(/\[[\s\S]*\]|\{[\s\S]*\}/); return m ? JSON.parse(m[0]) : []; }
      } catch (e) { clearTimeout(timer); lastErr = e.name === 'AbortError' ? new Error('Gemini не ответил за 25 с') : e; if (e.name !== 'AbortError' && !/Gemini \d|fetch/i.test(e.message)) throw e; }
    }
    throw lastErr || new Error('Gemini недоступен');
  },
  SCHEMA_EXERCISE: { type: 'OBJECT', properties: { muscles: { type: 'ARRAY', items: { type: 'STRING', enum: Object.keys({ chest: 1, shoulders: 1, triceps: 1, biceps: 1, back: 1, abs: 1, quads: 1, hamstrings: 1, glutes: 1, calves: 1 }) } }, bodyweight: { type: 'BOOLEAN' }, mult: { type: 'NUMBER' }, boss: { type: 'STRING', enum: ['', 'bench', 'squat', 'deadlift'] } }, required: ['muscles', 'bodyweight', 'mult', 'boss'] },
  classifyExercise(name) {
    const prompt = `Классифицируй силовое упражнение "${name}". muscles: задействованные группы по убыванию важности (chest, shoulders, triceps, biceps, back, abs, quads, hamstrings, glutes, calves). bodyweight: true если выполняется с собственным весом тела (подтягивания, отжимания, брусья). mult: коэффициент сложности для Power Score: 1.0 базовые многосуставные со штангой (становая), 1.3-1.6 присед/жим/тяга в наклоне, 1.9 жим стоя, 2.5-4 изолирующие (бицепс, махи). boss: "bench" если это вариант жима лёжа, "squat" если присед со штангой, "deadlift" если классическая становая, иначе "".`;
    return this.call([{ text: prompt }], this.SCHEMA_EXERCISE);
  },
  SCHEMA_TRANSLATE: { type: 'ARRAY', items: { type: 'OBJECT', properties: { src: { type: 'STRING' }, dst: { type: 'STRING' } }, required: ['src', 'dst'] } },
  translate(strings, langName) {
    const prompt = `Переведи строки интерфейса фитнес-приложения с русского на язык: ${langName}. Верни массив объектов {src, dst}, где src — исходная строка БЕЗ изменений, dst — перевод. Сохраняй числа, единицы, эмодзи, знаки «·», «→», «×», регистр и краткость. Названия упражнений переводи как принято в спорте. Строки:\n${strings.map(x => JSON.stringify(x)).join('\n')}`;
    return this.call([{ text: prompt }], this.SCHEMA_TRANSLATE);
  },
  parseWorkout(text) {
    const prompt = `Ты парсер тренировочного дневника. Сегодня ${U.today()}. Единицы веса пользователя: ${S.profile.units}. Извлеки все рабочие подходы из текста. exerciseName — точно из списка: ${Calc.exerciseNames().join(', ')} (или ближайшее название). weight — число в ${S.profile.units}. reps — число повторов в подходе. rmCategory: 1 повтор → "1RM", 2-3 → "2RM", 4-5 → "4RM", 6 и больше → "CUSTOM". date в формате YYYY-MM-DD (если не указана — сегодня). Текст: """${text}"""`;
    return this.call([{ text: prompt }], this.SCHEMA_WORKOUT);
  },
  parseFood(text) {
    const prompt = `Ты нутрициолог-парсер. Разбей описание еды на блюда и оцени для каждого калории (cals, ккал), белки (protein, г), углеводы (carbs, г), жиры (fat, г) для указанных или типичных порций. name — короткое название на русском. Текст: """${text}"""`;
    return this.call([{ text: prompt }], this.SCHEMA_FOOD);
  },
};

/* --------------------------- CLAN SERVICE ---------------------------
   Мок-реализация. Интерфейс (list, get, create, join, leave, setRole, battle)
   повторяет будущие вызовы Supabase: достаточно заменить тела методов.
   ------------------------------------------------------------------- */
const ClanService = {
  _seed(n) { let x = n * 9301 + 49297; return () => { x = (x * 9301 + 49297) % 233280; return x / 233280; }; },
  MOCK: null,
  online() { return typeof Net !== 'undefined' && Net.online(); },
  clans() { return this.online() ? Net.d.clans : this.mock(); },
  mock() {
    if (this.MOCK) return this.MOCK;
    const names = ['Iron Wolves', 'Night Lifters', 'Barbell Bros', 'Titan Squad', 'Apex Hunters', 'Deadlift Cult', 'Steel Phoenix'];
    const emblems = ['🐺', '🌙', '🦍', '⚡', '🦅', '💀', '🔥'];
    const nicks = ['Max_Power', 'Lena_Lift', 'Deadly_Dan', 'SquatQueen', 'IronMike', 'Nastya_PR', 'BenchKing', 'Kira_Fit', 'Tim_Titan', 'Olya_Oly', 'Rocky_RU', 'Vlad_Volume', 'Zoya_Z', 'Artem_Arms', 'Dasha_DL'];

      const members = Array.from({ length: size }, (_, j) => { const arenaIdx = Math.floor(r() * 6); const active = r() < 0.65; return { id: `m${i}_${j}`, nick: nicks[(i * 3 + j) % nicks.length] + (j > 14 ? j : ''), arenaIdx, trophies: CONFIG.ARENAS[arenaIdx].min + Math.floor(r() * 250), role: j === 0 ? 'leader' : j < 3 ? 'deputy' : 'member', week: active ? { workouts: 1 + Math.floor(r() * 4), prs: Math.floor(r() * 2), streak: Math.floor(r() * 6) } : { workouts: 0, prs: 0, streak: 0 } }; });

  // лидерборд 1RM: жим / присед / тяга. Онлайн: реальные профили; офлайн: демо

        rows.push({ nick: m.nick, arenaIdx: m.arenaIdx, clan: c.emblem, bench: Math.round(bw * lvl * 0.9 / 2.5) * 2.5, squat: Math.round(bw * lvl * 1.2 / 2.5) * 2.5, deadlift: Math.round(bw * lvl * 1.4 / 2.5) * 2.5 });

  /* --- игроки и друзья --- */
  allPlayers() {

  },
  myFriendCode() {

  },
  async addFriend(q) {
    q = String(q || '').trim().toLowerCase(); if (!q) return { error: 'Введи ник' };
    const p = this.allPlayers().find(x => x.nick.toLowerCase() === q || (x.friendCode && x.friendCode.toLowerCase() === q));
    if (!p) return { error: this.online() ? 'Игрок с таким ником или кодом не найден' : 'Игрок не найден (пока доступны демо-ники)' };
    if (S.friends.some(f => f.id === p.id)) return { error: 'Уже в друзьях' };
    if (this.online()) { try { await Net.addFriend(p.id); } catch (e) { return { error: e.message }; } }
    S.friends.push({ id: p.id, nick: p.nick, addedAt: Date.now() }); save(); return { friend: p };
  },
  async removeFriend(id) { if (this.online()) { try { await Net.removeFriend(id); } catch (_) {} } S.friends = S.friends.filter(f => f.id !== id); save(); },
  // лучший e1RM друга по упражнению. Онлайн: из профиля; офлайн: детерминированный мок
  friendRecord(friend, exName) {
    if (this.online()) { const p = Net.d.byId[friend.id]; return p ? Math.round(p.bests[exName] || 0) : 0; }
    const p = this.allPlayers().find(x => x.id === friend.id); if (!p) return 0;
    let h = 0; for (const ch of exName) h = (h * 31 + ch.charCodeAt(0)) % 9973;
    const r = this._seed(p.seed * 7 + h), info = U.exInfo(exName), bw = 65 + Math.round(r() * 25);
    const lvl = 0.5 + p.arenaIdx * 0.22 + r() * 0.35, base = bw * lvl / Math.max(0.6, info.mult * 0.8);
    return Math.round(base / 2.5) * 2.5;
  },
  friendBoard(exName) {
    const rows = (S.friends || []).map(f => ({ id: f.id, nick: f.nick, value: this.friendRecord(f, exName) }));
    rows.push({ id: 'me', self: true, nick: S.profile.nickname || 'Ты', value: Math.round(Calc.bestE1rm(exName)) });
    return rows.sort((a, b) => b.value - a.value);
  },
  /* --- кланы --- */
  selfMember(weekKey = null) { const me = weekKey && this.online() ? Net.myWeekStats(weekKey) : Calc.myWeek(); return { id: 'me', self: true, nick: S.profile.nickname || 'Ты', arenaIdx: S.game.arenaIdx, trophies: S.game.trophies, role: S.clan?.role || 'member', week: me }; },
  membersWithSelf(clan, weekKey = null) {
    if (!clan) return [];
    const myId = this.online() ? Net.uid : null;
    let list = clan.members.filter(m => m.id !== 'me' && m.id !== myId);
    if (weekKey && this.online()) list = list.map(m => ({ ...m, week: Net.weekOf(m.raw, weekKey) }));
    if (clan.id === S.clan?.id) list.push(this.selfMember(weekKey)); return list;
  },
  list() { const all = this.clans().map(c => ({ ...c })); if (S.clan && !all.some(c => c.id === S.clan.id)) all.push(S.clan); return all.map(c => { const ms = this.membersWithSelf(c); return { ...c, members: ms, score: Calc.clanScore(ms), trophies: ms.reduce((a, m) => a + m.trophies, 0) }; }).sort((a, b) => b.score - a.score); },
  async create(name, emblem) {
    if (this.online()) { try { await Net.rpc('clan_create', { p_name: name, p_emblem: emblem || '🛡️' }); await Net.refresh(true); return S.clan; } catch (e) { return { error: e.message }; } }
    const clan = { id: `clan_${U.uid()}`, name: name.slice(0, 24), emblem: emblem || '🛡️', code: 'APEX' + U.rnd(1000, 9999), members: [], role: 'leader', createdAt: Date.now(), battle: null };
    S.clan = clan; this.newBattle(); save(); return clan;
  },
  async join(code) {
    if (this.online()) { try { await Net.rpc('clan_join', { p_code: code }); await Net.refresh(true); return { clan: S.clan }; } catch (e) { return { error: e.message }; } }
    const c = this.mock().find(x => x.code.toLowerCase() === code.trim().toLowerCase());
    if (!c) return { error: 'Клан с таким кодом не найден' };
    if (c.members.length >= CONFIG.CLAN_MAX) return { error: 'Клан заполнен (30/30)' };
    S.clan = { ...c, members: c.members.map(m => ({ ...m })), role: 'member', battle: null }; this.newBattle(); save(); return { clan: S.clan };
  },
  async leave() { if (this.online()) { try { await Net.rpc('clan_leave'); } catch (e) { return { error: e.message }; } S.clan = null; save(); await Net.refresh(true); return { ok: true }; } S.clan = null; save(); return { ok: true }; },
  async setRole(memberId, role) { if (!S.clan || S.clan.role !== 'leader') return; if (this.online()) { try { await Net.rpc('clan_set_role', { p_member: memberId, p_role: role }); await Net.refresh(true); } catch (e) { return { error: e.message }; } return; } const m = S.clan.members.find(x => x.id === memberId); if (m) m.role = role; save(); },
  async kick(memberId) { if (!S.clan || S.clan.role === 'member') return; if (this.online()) { try { await Net.rpc('clan_kick', { p_member: memberId }); await Net.refresh(true); } catch (e) { return { error: e.message }; } return; } S.clan.members = S.clan.members.filter(m => m.id !== memberId); save(); },
  async newBattle(opponentId = null) {
    if (!S.clan) return;

    if (!opp) return { error: 'Пока нет других кланов для битвы' };
    const battle = { weekKey: U.weekKey(), opponentId: opp.id, resolved: false, challenged: !!opponentId };
    if (this.online()) { if (S.clan.role === 'member') return { error: 'Вызов может бросить лидер или заместитель' }; try { await Net.setBattle(S.clan.id, battle); } catch (e) { return { error: e.message }; } const c = Net.d.clans.find(x => x.id === S.clan.id); if (c) c.battle = battle; }
    S.clan.battle = battle; save(); return { ok: true, opponent: opp };
  },
  challengeTargets() { return this.list().filter(c => !S.clan || c.id !== S.clan.id); },
  async challengeClan(clanId) { // вызов конкретному клану: он становится соперником недели
    if (!S.clan || S.clan.role === 'member') return { error: 'Вызов может бросить лидер или заместитель' };
    if (clanId === S.clan.id) return { error: 'Нельзя вызвать свой клан' };
    const r = await this.newBattle(clanId); if (r && r.error) return r;
    return { ok: true, opponent: this.clans().find(c => c.id === clanId) };
  },
  /* --- дуэли 1 на 1 --- */
  async startDuel(opponentId = null) {
    if (this.online()) { try { await Net.startDuel(opponentId); await Net.refresh(true); return S.duel; } catch (e) { return { error: e.message }; } }
    const pool = this.allPlayers().filter(p => Math.abs(p.arenaIdx - S.game.arenaIdx) <= 1);
    const opp = opponentId ? this.allPlayers().find(p => p.id === opponentId) : U.pick(pool.length ? pool : this.allPlayers());
    if (!opp) return null;
    S.duel = { opponentId: opp.id, nick: opp.nick, weekKey: U.weekKey(), startedAt: Date.now() }; save(); return S.duel;
  },
  async cancelDuel() { if (this.online() && S.duel && S.duel.id) { try { await Net.cancelDuel(S.duel.id); } catch (_) {} } S.duel = null; save(); if (this.online()) Net.refresh(true); },
  duel() {
    const d = S.duel; if (!d) return null;
    const myScore = Calc.memberActivity({ week: Calc.myWeek() }), endsAt = U.parseDay(U.addDays(d.weekKey, 7)).getTime();
    if (this.online()) { const p = Net.d.byId[d.opponentId]; if (!p) return null; return { ...d, opponent: { id: p.id, nick: p.nick, arenaIdx: p.arenaIdx }, myScore, oppScore: Calc.memberActivity({ week: Net.weekOf(p.raw, d.weekKey) }), endsAt }; }
    const opp = this.allPlayers().find(p => p.id === d.opponentId); if (!opp) { S.duel = null; return null; }
    const r = this._seed(opp.seed * 13 + 5), dayIdx = (new Date().getDay() + 6) % 7; // 0..6
    const perDay = 20 + Math.round(r() * 30), oppScore = Math.round(perDay * (dayIdx + 1) * (0.6 + opp.arenaIdx * 0.1));
    return { ...d, opponent: opp, myScore, oppScore, endsAt };
  },
  _duelOutcome(res) {
    if (res && res.myScore > res.oppScore) { Game.addCoins(CONFIG.TROPHY.DUEL_WIN_COINS, 'Победа в дуэли'); Game.addTrophies(CONFIG.TROPHY.DUEL_WIN, 'Победа в дуэли'); Game.events.push({ type: 'toast', data: { msg: `Дуэль с ${res.opponent.nick} выиграна! +${CONFIG.TROPHY.DUEL_WIN_COINS} монет, +${CONFIG.TROPHY.DUEL_WIN} кубков`, cls: 'or' } }); }
    else if (res) Game.events.push({ type: 'toast', data: { msg: `Дуэль с ${res.opponent.nick} проиграна. В следующий раз!`, cls: 'red' } });
  },
  resolveDuel() { // в начале новой недели: награда и сброс
    if (this.online()) {
      const wk = U.weekKey(), done = S.game.resolvedDuels || (S.game.resolvedDuels = []);
      Net.d.duels.filter(x => x.week_key !== wk && x.status === 'active' && !done.includes(x.id)).forEach(x => {
        const oid = x.a_id === Net.uid ? x.b_id : x.a_id, p = Net.d.byId[oid]; done.push(x.id); if (!p) return;
        this._duelOutcome({ opponent: { nick: p.nick }, myScore: Calc.memberActivity({ week: Net.myWeekStats(x.week_key) }), oppScore: Calc.memberActivity({ week: Net.weekOf(p.raw, x.week_key) }) });
      });

    }

    if (this.online() && !weekKey && b.weekKey !== U.weekKey()) return null; // прошлая битва уже разобрана

    const wk = weekKey || b.weekKey;

  },
  resolveBattle() { // при старте: если неделя закончилась, раздаём награду
    if (!S.clan || !S.clan.battle) return;
    const b = S.clan.battle; if (b.weekKey === U.weekKey()) return;
    const key = `${S.clan.id}:${b.weekKey}`, done = S.game.resolvedBattles || (S.game.resolvedBattles = []);
    if (done.includes(key)) return; done.push(key);
    const res = this.battle(this.online() ? b.weekKey : null);
    const iWasActive = Calc.workoutsInWeek(b.weekKey) > 0;
    if (res && res.myScore >= res.oppScore && iWasActive) { Game.addCoins(CONFIG.TROPHY.CLAN_WIN_COINS, 'Победа в кланбитве'); Game.events.push({ type: 'toast', data: { msg: `Клан выиграл битву недели! +${CONFIG.TROPHY.CLAN_WIN_COINS} монет.`, cls: 'pu' } }); }
    if (this.online()) { if (S.clan.role !== 'member') Net.setBattle(S.clan.id, null).catch(() => {}); S.clan.battle = null; save(); }
    else this.newBattle();
  },
};

/* ------------------------------- NET (Supabase) -------------------------------
   Онлайн-слой. Если библиотека supabase-js не загрузилась или ключи не заданы,
   приложение работает как раньше: локальный аккаунт и демо-кланы.
   Публичные данные игрока (ник, кубки, арена, лучшие e1RM, активность недели)
   лежат в таблице profiles, полное состояние приложения — в app_state (приватно).
   --------------------------------------------------------------------------- */
const Net = {
  client: null, uid: null, ready: false, d: { players: [], clans: [], friends: [], duels: [], at: 0 }, _t: null, _refreshing: null,
  enabled() { return !!(window.supabase && CONFIG.SUPABASE_URL && CONFIG.SUPABASE_KEY); },
  online() { return this.ready && !!this.uid; },
  async init() {
    if (!this.enabled()) return false;
    try {
      this.client = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
      const { data } = await this.client.auth.getSession();
      this.uid = data && data.session ? data.session.user.id : null; this.ready = true;
      this.client.auth.onAuthStateChange((ev, s) => { this.uid = s ? s.user.id : null; });
      return true;
    } catch (e) { console.warn('Net.init', e); this.ready = false; return false; }
  },
  err(e) { const m = (e && (e.message || e.error_description || e.msg)) || 'Ошибка сети'; return /fetch|network|Failed to fetch/i.test(m) ? 'Нет связи с сервером. Проверь интернет.' : m; },
  /* ---- аккаунт ---- */
  async nickAvailable(nick) { const { data, error } = await this.client.rpc('nick_available', { p_nick: nick }); if (error) throw error; return !!data; },
  async signUp(email, pass, nick) {
    if (!(await this.nickAvailable(nick))) return { error: 'Этот никнейм уже занят' };
    const { data, error } = await this.client.auth.signUp({ email, password: pass, options: { data: { nickname: nick } } });
    if (error) return { error: this.err(error) };
    if (!data.session) return { ok: true, confirm: true }; // включено подтверждение email
    this.uid = data.user.id; return { ok: true };
  },
  async signIn(email, pass) {
    const { data, error } = await this.client.auth.signInWithPassword({ email, password: pass });
    if (error) return { error: /Invalid login/i.test(error.message) ? 'Неверный email или пароль' : /Email not confirmed/i.test(error.message) ? 'Сначала подтверди email по ссылке из письма' : this.err(error) };
    this.uid = data.user.id; return { ok: true };
  },
  async signOut() { try { await this.client.auth.signOut(); } catch (_) {} this.uid = null; this.d = { players: [], clans: [], friends: [], duels: [], at: 0 }; },
  async email() { try { const { data } = await this.client.auth.getUser(); return data && data.user ? data.user.email : ''; } catch (_) { return ''; } },
  /* ---- профиль и состояние ---- */
  myWeekStats(weekKey) {
    return { workouts: Calc.workoutsInWeek(weekKey), prs: S.lifts.filter(l => l.isPR && !l.flagged && U.weekKey(U.parseDay(l.date)) === weekKey).length, streak: Calc.streak().count };
  },
  profileRow() {
    const bests = {}; Calc.exerciseNames().forEach(e => { const v = Math.round(Calc.bestE1rm(e)); if (v > 0) bests[e] = v; });
    const boss = {}; ['bench', 'squat', 'deadlift'].forEach(k => { const exs = Calc.exerciseNames().filter(e => U.exInfo(e).boss === k); boss[k] = Math.round(Math.max(0, ...exs.map(e => Calc.bestE1rm(e)))); });
    const wk = U.weekKey(), prev = U.weekKey(U.parseDay(U.addDays(U.today(), -7)));
    const title = U.shopItem(S.profile.avatar.title); 
    return { id: this.uid, nickname: S.profile.nickname, friend_code: ClanService.myFriendCode(), sex: S.profile.sex, arena_idx: S.game.arenaIdx, trophies: S.game.trophies, level: Calc.level ? Calc.level().lvl || 1 : 1,
      power_score: Math.round(Calc.powerScore ? Calc.powerScore() : 0), bests, boss, week_key: wk, week: this.myWeekStats(wk), prev_week_key: prev, prev_week: this.myWeekStats(prev),
      title: title ? (title.custom ? S.profile.customTitle : title.name) : null };
  },
  async ensureProfile() {
    if (!this.online()) return;
    const { data } = await this.client.from('profiles').select('id,nickname,clan_id,clan_role').eq('id', this.uid).maybeSingle();
    if (data) { if (!S.profile.nickname) S.profile.nickname = data.nickname; return data; }
    const { error } = await this.client.from('profiles').insert(this.profileRow());
    if (error) { if (error.code === '23505') throw new Error('Этот никнейм уже занят'); throw error; }
    return null;
  },
  schedule() { if (!this.online()) return; clearTimeout(this._t); this._t = setTimeout(() => this.push().catch(e => console.warn('Net.push', e)), 1500); },
  async push() {
    if (!this.online()) return;
    const row = this.profileRow(); delete row.id;
    await this.client.from('profiles').update(row).eq('id', this.uid);
    const data = { ...S, account: null, session: undefined, clan: null, meta: { savedAt: Date.now(), device: navigator.userAgent.slice(0, 40) } };
    await this.client.from('app_state').upsert({ user_id: this.uid, data });
  },
  // при входе: если на сервере есть более свежее состояние, берём его; иначе отправляем локальное
  async pull() {
    if (!this.online()) return 'offline';
    const { data } = await this.client.from('app_state').select('data,updated_at').eq('user_id', this.uid).maybeSingle();
    const localFresh = S.lifts.length > 0 || S.game.trophies > 0;
    if (data && data.data && (!localFresh || (S.meta && S.meta.remoteAt !== data.updated_at && new Date(data.updated_at).getTime() > (S.meta.savedAt || 0)))) {
      const remote = data.data; remote.meta = { ...(remote.meta || {}), remoteAt: data.updated_at };
      const keepLang = S.profile.lang, keepTheme = S.profile.theme;
      Object.keys(S).forEach(k => delete S[k]); Object.assign(S, Store.migrate(remote)); S.profile.lang = keepLang || S.profile.lang; S.profile.theme = keepTheme || S.profile.theme;
      S.session = { loggedIn: true }; save(); return 'pulled';
    }
    S.session = { loggedIn: true }; save(); await this.push(); return 'pushed';
  },
  /* ---- чтение общих данных ---- */
  weekOf(p, weekKey) { if (!p) return { workouts: 0, prs: 0, streak: 0 }; if (p.week_key === weekKey) return p.week || { workouts: 0, prs: 0, streak: 0 }; if (p.prev_week_key === weekKey) return p.prev_week || { workouts: 0, prs: 0, streak: 0 }; return { workouts: 0, prs: 0, streak: 0 }; },
  toMember(p) { return { id: p.id, nick: p.nickname, arenaIdx: p.arena_idx || 0, trophies: p.trophies || 0, role: p.clan_role || 'member', week: this.weekOf(p, U.weekKey()), bests: p.bests || {}, boss: p.boss || {}, clanId: p.clan_id, friendCode: p.friend_code, title: p.title, raw: p, self: p.id === this.uid }; },
  refresh(force = false) {
    if (!this.online()) return Promise.resolve(false);
    if (this._refreshing) return this._refreshing;
    if (!force && Date.now() - this.d.at < 15000) return Promise.resolve(true);
    this._refreshing = (async () => {
      try {

  drawLiftChart() {
    const canvas = this.$('#lift-chart'); if (!canvas) return;
    if (this.charts.lift) { this.charts.lift.destroy(); this.charts.lift = null; }
    const now = Date.now(), span = { '1W': 7, '1M': 30, '1Y': 365, 'ALL': null }[this.liftZoom];
    const min = span ? now - span * 864e5 : undefined;
    const pts = S.lifts.filter(l => l.exerciseName === this.liftEx && l.rmCategory === this.liftRM && (!min || U.parseDay(l.date).getTime() >= min - 864e5)).sort((a, b) => a.date.localeCompare(b.date));
    const data = pts.map(l => ({ x: U.parseDay(l.date).getTime(), y: +U.w(l.weight), pr: l.isPR, flagged: l.flagged, reps: l.rmCategory === 'CUSTOM' ? l.reps : 0 }));
    this.$('#lift-chart-empty').classList.toggle('hidden', data.length > 0);
    canvas.parentElement.style.display = data.length ? '' : 'none';
    if (!data.length) return;
    const unit = span === 7 ? 'day' : span === 30 ? 'day' : span === 365 ? 'month' : 'month';
    const allMin = Math.min(...data.map(d => d.x));
    const light = S.profile.theme === 'light', grid = light ? '#E2E8F0' : '#1E293B', tick = light ? '#64748B' : '#94A3B8';
    this.charts.lift = new Chart(canvas, {
      type: 'line',
      data: { datasets: [{ data, borderColor: '#3B82F6', backgroundColor: 'rgba(59,130,246,.15)', fill: true, tension: .3, pointRadius: ctx => ctx.raw?.pr ? 6 : 3, pointBackgroundColor: ctx => ctx.raw?.flagged ? '#F97316' : ctx.raw?.pr ? '#F59E0B' : '#3B82F6', pointBorderColor: '#0B0E14' }] },
      options: { responsive: true, maintainAspectRatio: false, animation: { duration: 400 }, plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => `${c.raw.y} ${U.wUnit()}${c.raw.reps ? ' × ' + c.raw.reps : ''} ${c.raw.pr ? '· PR' : ''}${c.raw.flagged ? '· на проверке' : ''}` } } },
        scales: { x: { type: 'time', min: span ? min : allMin - 864e5, max: now + 864e5, time: { unit, tooltipFormat: 'd MMM yyyy', displayFormats: { day: 'd MMM', month: 'MMM yy' } }, grid: { color: grid }, ticks: { color: tick, maxTicksLimit: 6, font: { size: 10 } } }, y: { grid: { color: grid }, ticks: { color: tick, font: { size: 10 } }, title: { display: true, text: U.wUnit(), color: tick } } } }
    });

  historyRows() {

    S.lifts.forEach(l => add(l.date, d => { d.lifts++; if (l.isPR) d.prs++; }));

  // Загрузка фото: читаем через FileReader (работает в любых WebView), декодируем через createImageBitmap
  // (учитывает поворот EXIF) с запасным вариантом через <img>; если декодировать нельзя (например HEIC),
  // сохраняем исходный файл как есть, если он небольшой.
  async imageToDataUrl(file, max) {
    if (!file) throw new Error('no file');
    const dataUrl = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => rej(new Error('read')); fr.readAsDataURL(file); });
    const draw = (src, w, h) => { const side = Math.min(w, h), out = Math.min(max, side), c = document.createElement('canvas'); c.width = c.height = out; c.getContext('2d').drawImage(src, (w - side) / 2, (h - side) / 2, side, side, 0, 0, out, out); return c.toDataURL('image/jpeg', 0.82); };
    try {
      if (window.createImageBitmap) { const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }).catch(() => createImageBitmap(file)); const r = draw(bmp, bmp.width, bmp.height); bmp.close && bmp.close(); if (r.length > 50) return r; }
    } catch (_) {}
    try {
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('decode')); i.src = dataUrl; });
      const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height; if (w && h) return draw(img, w, h);
    } catch (_) {}
    if (dataUrl.length < 1.5e6) return dataUrl; // не смогли перекодировать, но файл небольшой: храним как есть
    throw new Error('Формат фото не поддерживается, выбери JPG или PNG');

    'set-lang'(el) { S.profile.lang = el.dataset.val; save(); UI.applyLang(); UI.openSettings(); UI.renderHeader(); UI.renderTab(UI.tab); MT.apply(document.body); },
    async 'friend-add'() { const r = await ClanService.addFriend(document.getElementById('friend-nick').value); if (r.error) { UI.toast(r.error, 'red'); return; } UI.toast('Добавлен: ' + r.friend.nick, 'bl'); UI.renderClans(); },
    async 'friend-remove'(el) { await ClanService.removeFriend(el.dataset.id); UI.renderClans(); },
    'fill-friend'(el) { document.getElementById('friend-nick').value = el.dataset.val; },
    'friend-ex'(el) { UI.friendEx = el.value; UI.renderClans(); },
    'board-key'(el) { UI.boardKey = el.dataset.val; UI.renderLifts(); },
    'open-food-text'() { UI.openFoodText(); },
    'open-food-manual'() { UI.openFoodManual(); },
    async 'ai-parse-food'(el) {
      const text = document.getElementById('food-text').value.trim(); if (!text) return;
      el.disabled = true; el.innerHTML = '<svg class="ic spin"><use href="#fa-circle-notch"/></svg> Оцениваю…';
      try { const items = await Gemini.parseFood(text); UI.renderFoodResult(Array.isArray(items) ? items : []); }
      catch (e) { UI.toast('Ошибка Gemini: ' + U.esc(e.message), 'red'); }
      finally { el.disabled = false; el.innerHTML = '<svg class="ic "><use href="#fa-bolt"/></svg> Оценить'; }
    },
    'food-confirm'() { const rows = UI.$$('[data-food-row]'); const items = rows.filter(r => r.querySelector('input').checked).map(r => UI._foodItems[+r.dataset.foodRow]); if (items.length) Game.logFood(items); UI.closeModal(); UI.toast(`Записано: ${items.length}`); App.afterChange(); },
    'food-manual-save'() { const g = id => document.getElementById(id).value; const name = g('fm-name').trim(); if (!name) { UI.toast('Введи название', 'red'); return; } Game.logFood([{ name, cals: g('fm-cals'), protein: g('fm-p'), carbs: g('fm-c'), fat: g('fm-f') }]); UI.closeModal(); App.afterChange(); },
    'delete-food'(el) { Game.deleteFood(el.dataset.id); App.afterChange(); },
    /* profile & shop */
    'open-shop'() { UI.openShop(); },
    'shop-item'(el) { const id = el.dataset.id; if (S.profile.owned.includes(id)) { if (U.shopItem(id).type !== 'extra') Game.equip(id); } else if (!Game.buy(id)) { UI.toast('Не хватает монет', 'red'); return; } else UI.toast('Куплено: ' + U.shopItem(id).name, 'pu'); UI.openShop(); UI.renderHeader(); UI.renderTab(UI.tab); },
    'avatar-hair'(el) { S.profile.avatar.hair = el.dataset.val; save(); UI.openShop(); UI.renderHeader(); },
    'avatar-color'(el) { S.profile.avatar[el.dataset.key] = el.value; save(); document.getElementById('shop-avatar').innerHTML = UI.avatarSVG(S.profile.avatar, 96); UI.renderHeader(); },
    /* settings */
    'open-settings'() { UI.openSettings(); },
    'set-theme'(el) { S.profile.theme = el.dataset.val; App.applyTheme(); save(); UI.openSettings(); UI.renderHeader(); UI.renderTab(UI.tab); },
    'set-units'(el) { S.profile.units = el.dataset.val; save(); UI.openSettings(); UI.renderTab(UI.tab); },
    'settings-save'() {
      const g = id => document.getElementById(id).value; const p = S.profile;
      p.nickname = g('st-nick').trim().slice(0, 16) || p.nickname; p.sex = g('st-sex'); const bw = U.toKg(g('st-bw')); if (bw > 20 && bw < 400) p.bodyweight = +bw.toFixed(1); const h = +g('st-h'); if (h > 100 && h < 250) p.height = h;
      p.geminiModel = g('st-model').trim() || CONFIG.GEMINI_MODEL_DEFAULT;
      App.saveGoalsFromInputs();
      UI.closeModal(); UI.toast('Сохранено'); Game.checkArenaUp(); App.afterChange();
    },
    'export-data'() { const blob = new Blob([Store.export(S)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `apex-arena-${U.today()}.json`; a.click(); },
    'reset-data'() { UI.confirm('Удалить все данные приложения на этом устройстве? Это нельзя отменить.', () => { Store.reset(); localStorage.removeItem(MT.KEY); location.reload(); }, { danger: true, yes: 'Удалить' }); },
    'auth-mode'(el) { UI.openAuth(el.dataset.val); },
    async 'auth-register'() {
      const g = id => document.getElementById(id).value, err = document.getElementById('ob-err');
      const nick = g('ob-nick').trim().slice(0, 16), age = parseInt(g('ob-age')), bw = parseFloat(g('ob-bw')), h = parseInt(g('ob-h'));
      if (!nick) { err.textContent = 'Введи никнейм'; return; }
      if (!age || age < 5 || age > 100) { err.textContent = 'Укажи реальный возраст'; return; }
      if (age < CONFIG.MIN_AGE) { S.profile.age = age; S.profile.blocked = true; save(); UI.openBlocked(); return; }
      if (!bw || bw < 25 || bw > 300 || !h || h < 100 || h > 250) { err.textContent = 'Проверь вес и рост'; return; }
      const btn = document.querySelector('[data-action=auth-register]'); if (btn) { btn.disabled = true; btn.textContent = 'Создаём…'; }
      const r = await Game.signUp(g('au-email'), g('au-pass'), nick); if (r.error) { err.textContent = r.error; if (btn) { btn.disabled = false; btn.textContent = 'Создать аккаунт'; } return; }
      Object.assign(S.profile, { nickname: nick, age, sex: g('ob-sex'), bodyweight: bw, height: h, createdAt: Date.now() });
      S.nutrition.goals = null; save();
      if (r.confirm) { err.className = 'text-xs text-em mt-2'; err.textContent = 'Письмо отправлено. Подтверди email по ссылке и войди.'; if (btn) { btn.disabled = false; btn.textContent = 'Создать аккаунт'; } return; }
      if (Net.online()) { try { await Net.ensureProfile(); Net.emailAddr = g('au-email').trim().toLowerCase(); await Net.pull(); Net.refresh(true).then(() => UI.renderTab(UI.tab)); } catch (e) { err.textContent = Net.err(e); if (btn) { btn.disabled = false; btn.textContent = 'Создать аккаунт'; } return; } }
      UI.closeModal(); UI.toast(`Добро пожаловать, ${nick}! Первая тренировка ждёт.`, 'pu'); App.afterChange();
    },
    async 'auth-login'() {
      const g = id => document.getElementById(id).value, err = document.getElementById('ob-err');
      const btn = document.querySelector('[data-action=auth-login]'); if (btn) { btn.disabled = true; btn.textContent = 'Входим…'; }
      const r = await Game.signIn(g('au-email'), g('au-pass')); if (r.error) { err.textContent = r.error; if (btn) { btn.disabled = false; btn.textContent = 'Войти'; } return; }
      if (Net.online()) { try { await Net.ensureProfile(); Net.emailAddr = g('au-email').trim().toLowerCase(); await Net.pull(); await Net.refresh(true); App.applyTheme(); UI.applyLang(); } catch (e) { err.textContent = Net.err(e); if (btn) { btn.disabled = false; btn.textContent = 'Войти'; } return; } }
      UI.closeModal(); UI.toast('С возвращением, ' + S.profile.nickname + '!', 'pu'); Game.boot(); UI.renderAll(); UI.flushEvents();
    },
    'auth-logout'() { UI.confirm(Net.online() ? 'Выйти из аккаунта? Прогресс сохранён в облаке, для входа нужен пароль.' : 'Выйти из аккаунта? Данные останутся на устройстве, для входа нужен пароль.', async () => { await Game.signOut(); UI.closeModal(); UI.openAuth('login'); }, { yes: 'Выйти' }); },
    'buy-boost'(el) { const r = Game.buyBoost(el.dataset.id); if (r.error) { UI.toast(r.error, 'red'); return; } UI.toast('Куплено: ' + U.shopItem(el.dataset.id).name, 'or'); UI.openShop(); UI.renderHeader(); },
    'custom-title-save'() { const v = document.getElementById('custom-title').value; if (!Game.setCustomTitle(v)) { UI.toast('Введи титул', 'red'); return; } UI.toast('Титул надет: ' + S.profile.customTitle, 'pu'); UI.openShop(); UI.renderTab(UI.tab); },
    async 'avatar-photo'(el) {
      const file = el.files && el.files[0]; if (!file) return;
      try { S.profile.avatar.photo = await App.imageToDataUrl(file, 160); save(); UI.openShop(); UI.renderHeader(); UI.renderTab(UI.tab); UI.toast('Фото установлено', 'pu'); }
      catch (e) { UI.toast('Не удалось загрузить фото: ' + (e && e.message || 'ошибка'), 'red'); } finally { try { el.value = ''; } catch (_) {} }
    },
    'avatar-photo-remove'() { S.profile.avatar.photo = null; save(); UI.openShop(); UI.renderHeader(); UI.renderTab(UI.tab); },
  },
  bind() {
    document.addEventListener('click', e => {
      const el = e.target.closest('[data-action]'); if (!el) return;
      if (el.tagName === 'SELECT' || el.tagName === 'INPUT') return;
      const fn = this.actions[el.dataset.action]; if (fn) { e.preventDefault(); fn.call(this.actions, el, e); }
    });
    document.addEventListener('change', e => { const el = e.target.closest('[data-action]'); if (!el || (el.tagName !== 'SELECT' && el.tagName !== 'INPUT')) return; const fn = this.actions[el.dataset.action]; if (fn) fn.call(this.actions, el, e); });
    document.addEventListener('input', e => { const el = e.target; if (el.matches('[data-action="avatar-color"]')) this.actions['avatar-color'](el); });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) { Game.boot(); UI.renderHeader(); UI.renderTab(UI.tab); UI.flushEvents(); if (Net.online()) Net.refresh(true).then(ok => { if (ok) { Game.boot(); UI.renderTab(UI.tab); UI.flushEvents(); } }); } });
    setInterval(() => UI.tick(), 1000);
  },
  async init() {
    this.applyTheme(); this.bind(); UI.applyLang(); MT.load(); MT.observe();
    if (S.profile.blocked) { UI.openBlocked(); return; }
    Game.boot(); UI.renderAll();
    const online = await Net.init();
    if (online) {
      if (Net.uid) {
        try { await Net.pull(); await Net.ensureProfile(); Net.email().then(e => { Net.emailAddr = e; }); } catch (e) { console.warn('Net boot', e); }
        this.applyTheme(); UI.applyLang(); Game.boot(); UI.renderAll();
        if (!S.profile.nickname) { UI.openAuth('register'); return; }
        UI.flushEvents();
        Net.refresh(true).then(ok => { if (ok) { Game.boot(); UI.renderHeader(); UI.renderTab(UI.tab); UI.flushEvents(); } });
      } else UI.openAuth(S.profile.nickname || (S.account && S.account.email) ? 'login' : 'register');
      return;
    }
    if (!S.profile.nickname) UI.openAuth('register'); else if (S.account && S.account.email && !(S.session && S.session.loggedIn)) UI.openAuth('login'); else UI.flushEvents();
  },
};

document.addEventListener('DOMContentLoaded', () => App.init());
</script>
</body>
</html>
