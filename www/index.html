    </div>`;
  },
  initStrip() {
    const el = this.$('#h-strip'); if (!el || !el.clientWidth) return;
    const cw = el.clientWidth / 7, days = this._stripDays, ti = days.indexOf(U.today());
    if (this._stripFocus) { const si = days.indexOf(this._stripFocus); el.scrollLeft = Math.max(0, Math.min(si - 3, ti - 4)) * cw; this._stripFocus = null; }
    else if (this._stripLeft != null) el.scrollLeft = this._stripLeft;
    else el.scrollLeft = (ti - 4) * cw; // сегодня — 5-й кружок слева
    const lbl = this.$('#h-month');

    const dataUrl = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => rej(new Error('read')); fr.readAsDataURL(file); });
    const draw = (src, w, h) => { const side = Math.min(w, h), out = Math.min(max, side), c = document.createElement('canvas'); c.width = c.height = out; c.getContext('2d').drawImage(src, (w - side) / 2, (h - side) / 2, side, side, 0, 0, out, out); return c.toDataURL('image/jpeg', 0.82); };
    try {
      if (window.createImageBitmap) { const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }).catch(() => createImageBitmap(file)); const r = draw(bmp, bmp.width, bmp.height); bmp.close && bmp.close(); if (r.length > 50) return r; }
    } catch (_) {}
    try {
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('decode')); i.src = dataUrl; });
      const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height; if (w && h) return draw(img, w, h);
    } catch (_) {}
    if (dataUrl.length < 1.5e6) return dataUrl; // не смогли перекодировать, но файл небольшой: храним как есть
    throw new Error('Формат фото не поддерживается, выбери JPG или PNG');
  },

    async 'duel-random'(el) { el.disabled = true; const d = await ClanService.startDuel(); el.disabled = false; if (!d) return; if (d.error) { UI.toast(d.error, 'red'); return; } UI.toast('Дуэль началась: ' + d.nick, 'or'); UI.renderClans(); },
    'duel-friend'() { const f = S.friends || []; if (!f.length) { UI.toast('Сначала добавь друзей', 'red'); return; } UI.modal(`<div class="font-bold mb-3">Кого вызвать?</div><div class="grid gap-2">${f.map(x => `<button class="btn btn-ghost" data-action="duel-start" data-id="${x.id}">${U.esc(x.nick)}</button>`).join('')}<button class="btn btn-ghost muted" data-action="close-modal">Отмена</button></div>`, { center: true }); },
    async 'duel-start'(el) { const d = await ClanService.startDuel(el.dataset.id); UI.closeModal(); if (d && d.error) { UI.toast(d.error, 'red'); return; } if (d) UI.toast('Дуэль началась: ' + d.nick, 'or'); UI.renderClans(); },
    'duel-cancel'() { UI.confirm('Сдаться в дуэли? Награды не будет.', async () => { await ClanService.cancelDuel(); UI.renderClans(); }, { danger: true, yes: 'Сдаться' }); },
    'clan-member-menu'(el) { UI.openMemberMenu(el.dataset.id, el.dataset.role); },
    async 'clan-set-role'(el) { const r = await ClanService.setRole(el.dataset.id, el.dataset.role); UI.closeModal(); if (r && r.error) UI.toast(r.error, 'red'); App.afterChange(); },
    async 'clan-kick'(el) { const r = await ClanService.kick(el.dataset.id); UI.closeModal(); if (r && r.error) UI.toast(r.error, 'red'); App.afterChange(); },
    /* nutrition */
    'open-goals'() { UI.openGoals(); },
    'goals-default'() { S.nutrition.goals = null; UI.closeModal(); App.afterChange(); },
    'goals-save'() { App.saveGoalsFromInputs(); UI.closeModal(); App.afterChange(); },
    'goals-default-inline'() { S.nutrition.goals = null; save(); UI.openSettings('food'); },
    'sleep-save'() { const h = parseFloat(document.getElementById('sleep-h').value); if (isNaN(h) || h <= 0) { UI.toast('Укажи часы сна', 'red'); return; } const r = Game.logSleep(h, UI.hDay || U.today()); const g = Calc.sleepGrade(Calc.sleepScore(r.hours), r.hours); UI.toast(`Сон ${r.hours} ч: ${g.label}`, 'pu'); App.afterChange(); },
    'set-lang'(el) { S.profile.lang = el.dataset.val; save(); UI.applyLang(); UI.openSettings(); UI.renderHeader(); UI.renderTab(UI.tab); MT.kick(); },
    async 'friend-add'() { const r = await ClanService.addFriend(document.getElementById('friend-nick').value); if (r.error) { UI.toast(r.error, 'red'); return; } App.clearDraft('friend-nick'); UI.toast(r.sent ? 'Заявка отправлена: ' + U.esc(r.player.nick) : 'Добавлен: ' + U.esc(r.friend.nick), 'bl'); UI.renderClans(); },
    async 'friend-add-id'(el) { el.disabled = true; const r = await ClanService.addFriendById(el.dataset.id); el.disabled = false; if (r.error) { UI.toast(r.error, 'red'); return; } UI.toast(r.sent ? 'Заявка отправлена: ' + U.esc(r.player.nick) : 'Теперь вы друзья: ' + U.esc(r.friend.nick), 'bl'); if (UI.$('#modal')) UI.openMiniProfile(el.dataset.id); UI.renderClans(); },
    async 'friend-accept'(el) { const r = await ClanService.respondRequest(el.dataset.id, true); if (r.error) { UI.toast(r.error, 'red'); return; } UI.toast('Заявка принята', 'bl'); if (UI.$('#modal')) UI.openNotifs(); UI.renderClans(); },
    async 'friend-decline'(el) { const r = await ClanService.respondRequest(el.dataset.id, false); if (r.error) { UI.toast(r.error, 'red'); return; } if (UI.$('#modal')) UI.openNotifs(); UI.renderClans(); },
    async 'friend-accept-user'(el) { const q = ClanService.incoming().find(x => x.from_id === el.dataset.id); if (!q) return; await this['friend-accept']({ dataset: { id: q.id } }); UI.openMiniProfile(el.dataset.id); },
    'friend-remove-ask'(el) { const f = (S.friends || []).find(x => x.id === el.dataset.id); UI.confirm(`Удалить ${U.esc(f ? f.nick : '')} из друзей?`, async () => { await ClanService.removeFriend(el.dataset.id); UI.renderClans(); }, { danger: true, yes: 'Удалить' }); },
    async 'friend-remove'(el) { await ClanService.removeFriend(el.dataset.id); UI.renderClans(); },
    'open-page'(el) { UI.openPage(el.dataset.kind); },
    'page-back'() { UI.closePage(); },

    'point-menu'(el) { UI.openPointMenu(el.dataset.id); },
    'fill-friend'(el) { document.getElementById('friend-nick').value = el.dataset.val; },

    'board-key'(el) { UI.boardKey = el.dataset.val; UI.renderLifts(); },
    'open-food-text'() { UI.openFoodText(); },
    'open-food-manual'() { UI.openFoodManual(); },
    async 'ai-parse-food'(el) {
      const text = document.getElementById('food-text').value.trim(); if (!text) return;
      el.disabled = true; el.innerHTML = '<svg class="ic spin"><use href="#fa-circle-notch"/></svg> Оцениваю…';
      try { const items = await Gemini.parseFood(text); UI.renderFoodResult(Array.isArray(items) ? items : []); }
      catch (e) { UI.toast('Ошибка Gemini: ' + U.esc(e.message), 'red'); }
      finally { el.disabled = false; el.innerHTML = '<svg class="ic "><use href="#fa-bolt"/></svg> Оценить'; }
    },
    'food-confirm'() { const rows = UI.$$('[data-food-row]'); const items = rows.filter(r => r.querySelector('input').checked).map(r => UI._foodItems[+r.dataset.foodRow]); if (items.length) Game.logFood(items, UI.hDay || U.today()); UI.closeModal(); UI.toast(`Записано: ${items.length}`); App.afterChange(); UI.openNutrition(); },
    'food-manual-save'() { const g = id => document.getElementById(id).value; const name = g('fm-name').trim(); if (!name) { UI.toast('Введи название', 'red'); return; } App.clearDraft('fm-name'); Game.logFood([{ name, cals: g('fm-cals'), protein: g('fm-p'), carbs: g('fm-c'), fat: g('fm-f') }], UI.hDay || U.today()); UI.closeModal(); App.afterChange(); UI.openNutrition(); },
    'delete-food'(el) { Game.deleteFood(el.dataset.id); App.afterChange(); },
    /* profile & shop */
    'open-shop'() { UI.openShop(); },
    'shop-item'(el) { const id = el.dataset.id; if (S.profile.owned.includes(id)) { if (U.shopItem(id).type !== 'extra') Game.equip(id); } else if (!Game.buy(id)) { UI.toast('Не хватает монет', 'red'); return; } else UI.toast('Куплено: ' + U.shopItem(id).name, 'pu'); UI.openShop(); UI.renderHeader(); UI.renderTab(UI.tab); },

    'avatar-color'(el) { S.profile.avatar[el.dataset.key] = el.value; save(); document.getElementById('shop-avatar').innerHTML = UI.avatarSVG(S.profile.avatar, 96); UI.renderHeader(); },
    /* settings */
    'open-settings'() { UI.openSettings(); },
    'set-theme'(el) { S.profile.theme = el.dataset.val; App.applyTheme(); save(); UI.openSettings(); UI.renderHeader(); UI.renderTab(UI.tab); },
    'set-units'(el) { S.profile.units = el.dataset.val; save(); UI.openSettings(); UI.renderTab(UI.tab); },
    'settings-save'() {
      const el = id => document.getElementById(id), p = S.profile;
      if (el('st-nick')) p.nickname = el('st-nick').value.trim().slice(0, 16) || p.nickname;
      if (el('st-sex')) p.sex = App.segVal('st-sex') || p.sex;
      if (el('st-h')) { const h = +el('st-h').value; if (h > 100 && h < 250) p.height = h; }
      if (el('st-age')) { const a = parseInt(el('st-age').value); if (a >= CONFIG.MIN_AGE && a < 100) p.age = a; }
      if (el('st-bw')) { const bw = U.toKg(el('st-bw').value); if (bw > 20 && bw < 400 && Math.abs(bw - (p.bodyweight || 0)) > 0.04) Game.logWeight(bw, U.today()); }
      if (el('g-cals')) App.saveGoalsFromInputs();
      if (el('st-water')) { const w = +el('st-water').value; if (w >= 500 && w <= 8000) p.waterGoal = Math.round(w); }
      if (el('st-cup')) { const c = +el('st-cup').value; if (c >= 50 && c <= 3000) p.cupMl = Math.round(c); }
      save(); UI.closeModal(); UI.toast(T('save') + ' ✓'); Game.checkArenaUp(); App.afterChange();
    },
    'export-data'() { const blob = new Blob([Store.export(S)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `apex-arena-${U.today()}.json`; a.click(); },
    'reset-data'() { UI.confirm('Удалить все данные приложения на этом устройстве? Это нельзя отменить.', () => { Store.reset(); localStorage.removeItem(MT.KEY); location.reload(); }, { danger: true, yes: 'Удалить' }); },
    'auth-mode'(el) { UI.openAuth(el.dataset.val); },
    async 'auth-register'() {
      const g = id => document.getElementById(id).value, err = document.getElementById('ob-err');
      const nick = g('ob-nick').trim().slice(0, 16), age = parseInt(g('ob-age')), bw = parseFloat(g('ob-bw')), h = parseInt(g('ob-h'));
      if (!nick) { err.textContent = 'Введи никнейм'; return; }
      if (!age || age < 5 || age > 100) { err.textContent = 'Укажи реальный возраст'; return; }
      if (age < CONFIG.MIN_AGE) { S.profile.age = age; S.profile.blocked = true; save(); UI.openBlocked(); return; }
      if (!bw || bw < 25 || bw > 300 || !h || h < 100 || h > 250) { err.textContent = 'Проверь вес и рост'; return; }
      const btn = document.querySelector('[data-action=auth-register]'); if (btn) { btn.disabled = true; btn.textContent = 'Создаём…'; }
      const r = await Game.signUp(g('au-email'), g('au-pass'), nick); if (r.error) { err.textContent = r.error; if (btn) { btn.disabled = false; btn.textContent = 'Создать аккаунт'; } return; }
      Object.assign(S.profile, { nickname: nick, age, sex: g('ob-sex'), bodyweight: bw, height: h, createdAt: Date.now() });
      S.nutrition.goals = null; save();
      if (r.confirm) { err.className = 'text-xs text-em mt-2'; err.textContent = 'Письмо отправлено. Подтверди email по ссылке и войди.'; if (btn) { btn.disabled = false; btn.textContent = 'Создать аккаунт'; } return; }
      if (Net.online()) { try { await Net.ensureProfile(); Net.emailAddr = g('au-email').trim().toLowerCase(); await Net.pull(); Net.refresh(true).then(() => UI.renderTab(UI.tab)); } catch (e) { err.textContent = Net.err(e); if (btn) { btn.disabled = false; btn.textContent = 'Создать аккаунт'; } return; } }
      UI.closeModal(); UI.toast(`Добро пожаловать, ${nick}! Первая тренировка ждёт.`, 'pu'); App.afterChange();
    },
    async 'auth-login'() {
      const g = id => document.getElementById(id).value, err = document.getElementById('ob-err');
      const btn = document.querySelector('[data-action=auth-login]'); if (btn) { btn.disabled = true; btn.textContent = 'Входим…'; }
      const r = await Game.signIn(g('au-email'), g('au-pass')); if (r.error) { err.textContent = r.error; if (btn) { btn.disabled = false; btn.textContent = 'Войти'; } return; }
      if (Net.online()) { try { await Net.ensureProfile(); Net.emailAddr = g('au-email').trim().toLowerCase(); await Net.pull(); await Net.refresh(true); App.applyTheme(); UI.applyLang(); } catch (e) { err.textContent = Net.err(e); if (btn) { btn.disabled = false; btn.textContent = 'Войти'; } return; } }
      UI.closeModal(); UI.toast('С возвращением, ' + S.profile.nickname + '!', 'pu'); Game.boot(); UI.renderAll(); UI.flushEvents();
    },
    'auth-logout'() { UI.confirm(Net.online() ? 'Выйти из аккаунта? Прогресс сохранён в облаке, для входа нужен пароль.' : 'Выйти из аккаунта? Данные останутся на устройстве, для входа нужен пароль.', async () => { await Game.signOut(); UI.closeModal(); UI.openAuth('login'); }, { yes: 'Выйти' }); },
    'buy-boost'(el) { const r = Game.buyBoost(el.dataset.id); if (r.error) { UI.toast(r.error, 'red'); return; } UI.toast('Куплено: ' + U.shopItem(el.dataset.id).name, 'or'); UI.openShop(); UI.renderHeader(); },
    'custom-title-save'() { const v = document.getElementById('custom-title').value; if (!Game.setCustomTitle(v)) { UI.toast('Введи титул', 'red'); return; } UI.toast('Титул надет: ' + S.profile.customTitle, 'pu'); UI.openShop(); UI.renderTab(UI.tab); },
    async 'avatar-photo'(el) {
      const file = el.files && el.files[0]; if (!file) return;
      try { S.profile.avatar.photo = await App.imageToDataUrl(file, 160); save(); UI.openShop(); UI.renderHeader(); UI.renderTab(UI.tab); UI.toast('Фото установлено', 'pu'); }
      catch (e) { UI.toast('Не удалось загрузить фото: ' + (e && e.message || 'ошибка'), 'red'); } finally { try { el.value = ''; } catch (_) {} }
    },
    'avatar-photo-remove'() { S.profile.avatar.photo = null; save(); UI.openShop(); UI.renderHeader(); UI.renderTab(UI.tab); },
  },
  bind() {
    document.addEventListener('click', e => {
      if (!e.target.closest('.dd')) UI.closeDD();
      const el = e.target.closest('[data-action]'); if (!el) return;
      if (el.tagName === 'SELECT' || el.tagName === 'INPUT') return;
      const fn = this.actions[el.dataset.action]; if (fn) { e.preventDefault(); fn.call(this.actions, el, e); }
    });
    document.addEventListener('change', e => { const el = e.target.closest('[data-action]'); if (!el || (el.tagName !== 'SELECT' && el.tagName !== 'INPUT')) return; const fn = this.actions[el.dataset.action]; if (fn) fn.call(this.actions, el, e); });
    document.addEventListener('input', e => { const el = e.target; if (el.matches('[data-action="avatar-color"]')) this.actions['avatar-color'](el); else if (el.matches('[data-action="lift-zoom-range"]')) UI.liftZoom(+el.value); else if (el.matches('[data-action="clan-name-input"]')) UI._clanNameDraft = el.value; if (el.id && el.hasAttribute('data-draft')) App.saveDraft(el.id, el.value); });
    // сворачивание: не перерисовываем открытое окно и поля ввода, чтобы текст не пропадал
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { this._hiddenAt = Date.now(); return; }
      const away = Date.now() - (this._hiddenAt || Date.now()), newDay = UI._dayKey !== U.today();
      if (newDay) { UI._dayKey = U.today(); UI.hDay = U.today(); UI._stripLeft = null; }
      Game.boot(); UI.renderHeader();
      const busy = () => !!(document.getElementById('modal') || (document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName)));
      if (!busy() && (newDay || away > 5 * 6e4)) UI.keepInputs(() => UI.renderTab(UI.tab));
      else if (UI.tab === 'lifts') setTimeout(() => { if (UI.charts.lift) UI.charts.lift.resize(); else UI.drawLiftChart(); }, 300);
      UI.flushEvents();
      if (Net.online()) Net.refresh(true).then(ok => { if (ok) { Game.boot(); UI.renderHeader(); if (!busy()) UI.keepInputs(() => { if (UI.tab !== 'lifts') UI.renderTab(UI.tab); if (UI._page) UI.renderPage(); }); UI.flushEvents(); } });
    });
    window.addEventListener('popstate', () => { if (UI._ignorePop) { UI._ignorePop = false; return; } if (UI._page) UI.closePage(true); });
    const CapApp = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
    if (CapApp && CapApp.addListener) CapApp.addListener('backButton', () => { if (!UI.back()) { if (CapApp.minimizeApp) CapApp.minimizeApp(); else CapApp.exitApp(); } });
    setInterval(() => UI.tick(), 1000);
    this.bindPull();
  },
  // свайп вниз сверху страницы — обновить; у краёв страница чуть «пружинит»
  bindPull() {
    const main = document.getElementById('main'), ptr = document.getElementById('ptr'); if (!main || !ptr) return;
    let y0 = null, x0 = 0, mode = null, d = 0;
    const back = () => { main.style.transition = 'transform .35s cubic-bezier(.2,.8,.2,1)'; main.style.transform = ''; if (!ptr.classList.contains('spin')) { ptr.style.transition = 'opacity .25s, transform .25s'; ptr.style.opacity = '0'; ptr.style.transform = 'translateY(-20px)'; } setTimeout(() => { main.style.transition = ''; }, 380); };
    window.addEventListener('touchstart', e => { if (document.getElementById('modal') || document.getElementById('page') || document.body.classList.contains('plus-open') || e.touches.length > 1 || (e.target.closest && e.target.closest('.h-strip,.dd-menu,input[type=range],canvas'))) { y0 = null; return; } y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; mode = null; d = 0; }, { passive: true });
    window.addEventListener('touchmove', e => {
      if (y0 == null) return; const dy = e.touches[0].clientY - y0, dx = e.touches[0].clientX - x0;
      if (!mode) { if (Math.abs(dy) < 6 && Math.abs(dx) < 6) return; if (Math.abs(dx) > Math.abs(dy)) { mode = 'none'; return; }
        const atTop = window.scrollY <= 0, atBottom = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2;
        mode = atTop && dy > 0 ? 'top' : atBottom && dy < 0 ? 'bottom' : 'none'; }
      if (mode === 'top') { d = Math.min(120, Math.max(0, dy) * 0.45); main.style.transform = `translateY(${d}px)`; ptr.style.transition = 'none'; ptr.style.opacity = String(Math.min(1, d / 45)); ptr.style.transform = `translateY(${d * 0.55 - 20}px) rotate(${d * 4}deg)`; ptr.classList.toggle('ready', d > 65); }
      else if (mode === 'bottom') { d = Math.max(-60, Math.min(0, dy) * 0.3); main.style.transform = `translateY(${d}px)`; }
    }, { passive: true });
    const end = () => { if (y0 == null) return; const go = mode === 'top' && d > 65; y0 = null; if (mode === 'top' || mode === 'bottom') back(); mode = null; if (go) App.refresh(); };
    window.addEventListener('touchend', end, { passive: true }); window.addEventListener('touchcancel', end, { passive: true });
  },
  async refresh() {
    const ptr = document.getElementById('ptr'); ptr.classList.add('spin'); ptr.style.transition = 'opacity .2s, transform .2s'; ptr.style.opacity = '1'; ptr.style.transform = 'translateY(16px)';
    try { if (Net.online()) { await Net.pull(); await Net.refresh(true); Net.loadConfig && Net.loadConfig(); } Game.boot(); if (UI.hDay && UI.hDay > U.today()) UI.hDay = U.today(); UI.renderAll(); UI.flushEvents(); MT.kick(); UI.toast(T('update') + ' ✓', 'bl'); }
    catch (e) { UI.toast(Net.err ? Net.err(e) : 'Ошибка сети', 'red'); }
    finally { setTimeout(() => { ptr.classList.remove('spin', 'ready'); ptr.style.opacity = '0'; ptr.style.transform = 'translateY(-20px)'; }, 350); }
  },
  async init() {
    this.applyTheme(); this.bind(); UI.applyLang(); MT.load(); MT.observe();
    if (S.profile.blocked) { UI.openBlocked(); return; }
    UI.tab = 'arena'; UI.hDay = UI._dayKey = U.today(); UI._exToChart = n => { UI.closeModal(); if (n) UI.liftEx = n; App.afterChange(); }; Game.boot(); UI.goTab('arena'); UI.renderHeader();
    const online = await Net.init();
    if (online) {
      if (Net.uid) {
        try { await Net.pull(); await Net.ensureProfile(); Net.email().then(e => { Net.emailAddr = e; }); } catch (e) { console.warn('Net boot', e); }
        this.applyTheme(); UI.applyLang(); Game.boot(); UI.renderAll();
        if (!S.profile.nickname) { UI.openAuth('register'); return; }
        UI.flushEvents();
        Net.refresh(true).then(ok => { if (ok) { Game.boot(); UI.renderHeader(); UI.renderTab(UI.tab); UI.flushEvents(); } });
      } else UI.openAuth(S.profile.nickname || (S.account && S.account.email) ? 'login' : 'register');
      return;
    }
    if (!S.profile.nickname) UI.openAuth('register'); else if (S.account && S.account.email && !(S.session && S.session.loggedIn)) UI.openAuth('login'); else UI.flushEvents();
  },
};

document.addEventListener('DOMContentLoaded', () => App.init());
</script>
