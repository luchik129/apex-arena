name: Build iOS

# v28: сборка для iPhone на Mac-сервере GitHub.
# Без ключей Apple: проверяем, что проект собирается (для симулятора).
# С ключами в Secrets (APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8): подписываем и отправляем в TestFlight.
on:
  push:
    branches: [main]
  pull_request:
    paths: ['ios/**', 'index.html', 'www/**', 'capacitor.config.json', 'package.json', 'package-lock.json', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Самый новый Xcode (App Store принимает сборки только из свежего Xcode)
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)
          echo "Xcode: $X"; sudo xcode-select -s "$X"; xcodebuild -version
      - name: Capacitor
        run: |
          npm ci
          npx cap sync ios
      - name: Проверка сборки (симулятор, без подписи)
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ../../ios-build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" ../../ios-build.log || { echo "::error::$(grep -n 'error:' ../../ios-build.log | head -20 | tr '\n' ' ')"; exit 1; }
      - name: Подписать и отправить в TestFlight
        if: github.event_name != 'pull_request'
        working-directory: ios/App
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$TEAM" ] || [ -z "$KEY_ID" ] || [ -z "$ISSUER" ] || [ -z "$KEY_P8" ]; then echo "Нет ключей Apple в Secrets — TestFlight пропускаем"; exit 0; fi
          # Секреты часто вставляют с пробелами/переносами — чистим
          TEAM=$(printf '%s' "$TEAM" | tr -d '[:space:]')
          KEY_ID=$(printf '%s' "$KEY_ID" | tr -d '[:space:]')
          ISSUER=$(printf '%s' "$ISSUER" | tr -d '[:space:]')
          KEY="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          # Собираем .p8 заново из base64-тела: переживает \r, лишние пробелы, ключ одной строкой или весь файл в base64
          KEY_P8="$KEY_P8" python3 - "$KEY" <<'PY'
          import os, sys, re, base64
          raw = os.environ["KEY_P8"].replace("\\n", "\n")
          if "PRIVATE KEY" not in raw:
              try: raw = base64.b64decode(re.sub(r"\s+", "", raw)).decode()
              except Exception: pass
          body = re.sub(r"-----(BEGIN|END)[^-]*-----", "", raw)
          body = re.sub(r"[^A-Za-z0-9+/=]", "", body)
          lines = [body[i:i+64] for i in range(0, len(body), 64)]
          open(sys.argv[1], "w").write("-----BEGIN PRIVATE KEY-----\n" + "\n".join(lines) + "\n-----END PRIVATE KEY-----\n")
          print("p8: header in secret:", "BEGIN PRIVATE KEY" in raw, "| body chars:", len(body))
          PY
          openssl pkey -in "$KEY" -noout 2>/dev/null && echo "p8: ключ читается ✓" || { echo "::error::ASC_KEY_P8 не похож на ключ .p8 — вставь заново весь файл AuthKey_….p8 (от BEGIN до END)"; exit 1; }
          echo "Key ID length: ${#KEY_ID}, Issuer length: ${#ISSUER}, Team length: ${#TEAM}"
          # Для архива Xcode делает Development-профиль, а Apple не даёт его без хотя бы одного устройства в команде.
          # Если устройств нет — регистрируем одно служебное через App Store Connect API (export потом подписывает Distribution).
          python3 -m pip install -q --disable-pip-version-check pyjwt cryptography >/dev/null 2>&1 || pip3 install -q --break-system-packages pyjwt cryptography
          KEY_ID="$KEY_ID" ISSUER="$ISSUER" python3 - "$KEY" <<'PY'
          import os, sys, time, json, urllib.request, jwt
          tok = jwt.encode({"iss": os.environ["ISSUER"], "iat": int(time.time()), "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"},
                           open(sys.argv[1]).read(), algorithm="ES256", headers={"kid": os.environ["KEY_ID"], "typ": "JWT"})
          H = {"Authorization": "Bearer " + tok, "Content-Type": "application/json"}
          def call(method, path, body=None):
              r = urllib.request.Request("https://api.appstoreconnect.apple.com" + path, method=method, headers=H,
                                         data=json.dumps(body).encode() if body else None)
              return json.load(urllib.request.urlopen(r))
          devs = call("GET", "/v1/devices?filter[platform]=IOS&filter[status]=ENABLED&limit=1")["data"]
          if devs:
              print("devices: есть", len(devs))
          else:
              call("POST", "/v1/devices", {"data": {"type": "devices", "attributes": {"name": "CI build device", "platform": "IOS", "udid": "00008110-001A2B3C4D5E6F70"}}})
              print("devices: зарегистрировано служебное устройство")
          PY
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER"
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION=1.0 CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            $AUTH archive 2>&1 | tee ../../ios-archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" ../../ios-archive.log || { echo "::error::$(grep -n 'error:' ../../ios-archive.log | head -20 | tr '\n' ' ')"; exit 1; }
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/out" $AUTH 2>&1 | tee ../../ios-export.log | grep -E "error:|EXPORT (SUCCEEDED|FAILED)|Upload" || true
          grep -q "EXPORT SUCCEEDED" ../../ios-export.log || { echo "::error::$(grep -n 'error' ../../ios-export.log | head -20 | tr '\n' ' ')"; exit 1; }
          echo "::notice::Сборка ${{ github.run_number }} отправлена в TestFlight"
