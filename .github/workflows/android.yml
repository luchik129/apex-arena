name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Capacitor (android/ ссылается на node_modules/@capacitor/android)
        run: |
          npm ci
          npx cap sync android
      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "1.0.${{ github.run_number }}"
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee ../build.log || { echo "::error::$(grep -n -i -B2 -A8 'what went wrong\|error:' ../build.log | tail -c 3000 | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }
          cp app/build/outputs/apk/debug/app-debug.apk ../apex-arena.apk
      # v27: подписанный AAB для Google Play — собирается, только если в Secrets добавлен ключ (ANDROID_KEYSTORE_B64 и пароли)
      - name: Build signed release AAB (Google Play)
        id: aab
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "1.0.${{ github.run_number }}"
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then echo "Нет ключа подписи — AAB пропускаем"; exit 0; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          set -o pipefail
          ./gradlew bundleRelease --no-daemon 2>&1 | tee ../aab.log || { echo "::error::$(grep -n -i -B2 -A8 'what went wrong\|error:' ../aab.log | tail -c 3000 | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }
          cp app/build/outputs/bundle/release/app-release.aab ../flexo-league.aab
          echo "built=1" >> "$GITHUB_OUTPUT"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apex-arena-apk
          path: apex-arena.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Flexo League build ${{ github.run_number }}
          body: "Скачай apex-arena.apk и установи на телефон (разреши установку из неизвестных источников)."
          files: |
            apex-arena.apk
            flexo-league.aab
