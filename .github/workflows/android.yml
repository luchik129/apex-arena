name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Capacitor (android/ ссылается на node_modules/@capacitor/android)
        run: |
          npm ci
          npx cap sync android
      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Inject Gemini key (secret GEMINI_KEY)
        run: |
          if [ -n "${{ secrets.GEMINI_KEY }}" ]; then sed -i "s|__GEMINI_KEY__|${{ secrets.GEMINI_KEY }}|" www/index.html; else echo '::warning::Секрет GEMINI_KEY не задан: функции Gemini в APK будут выключены'; fi
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee ../build.log || { echo "::error::$(grep -n -i -B2 -A8 'what went wrong\|error:' ../build.log | tail -c 3000 | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }
          cp app/build/outputs/apk/debug/app-debug.apk ../apex-arena.apk
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apex-arena-apk
          path: apex-arena.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: APEX Arena build ${{ github.run_number }}
          body: "Скачай apex-arena.apk и установи на телефон (разреши установку из неизвестных источников)."
          files: apex-arena.apk
