<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B0E14">
<title>Flexo Admin</title>
<link rel="icon" href="../icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<style>
:root {
  --bg: #0B0E14; --bg2: #0F141D; --card: #121824; --card2: #161E2C; --line: #1E293B; --line2: #273449;
  --tx: #E6EDF7; --mu: #8B98AE; --mu2: #5D6B82;
  --em: #10B981; --bl: #3B82F6; --or: #F97316; --pu: #8B5CF6; --rd: #EF4444; --am: #F59E0B;
  --r: 14px; --sh: 0 10px 30px rgba(0,0,0,.35);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--tx); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--mu); } .mu2 { color: var(--mu2); }
.hide { display: none !important; }
svg.i { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* layout */
.app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; border-right: 1px solid var(--line); background: var(--bg2); padding: 18px 12px; display: flex; flex-direction: column; gap: 4px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; }
.brand img { width: 34px; height: 34px; border-radius: 9px; }
.brand b { font-size: 15px; letter-spacing: .2px; } .brand small { display: block; color: var(--mu); font-size: 11px; }
.nav { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; color: var(--mu); text-decoration: none; font-weight: 600; cursor: pointer; border: 0; background: none; width: 100%; text-align: left; }
.nav:hover { background: var(--card); color: var(--tx); }
.nav.on { background: linear-gradient(90deg, rgba(16,185,129,.16), rgba(16,185,129,.04)); color: var(--tx); box-shadow: inset 2px 0 0 var(--em); }
.nav .i { font-size: 17px; }
.nav .bd { margin-left: auto; }
.side .me { margin-top: auto; padding: 10px; border-top: 1px solid var(--line); font-size: 12px; color: var(--mu); }
.main { min-width: 0; padding: 26px 30px 90px; max-width: 1240px; }
.top { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
.top h1 { font-size: 22px; margin: 0; letter-spacing: -.2px; }
.top .sp { flex: 1; }
.bnav { display: none; }

/* atoms */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); }
.pad { padding: 16px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line2); background: var(--card2); font-weight: 650; cursor: pointer; white-space: nowrap; transition: .12s; }
.btn:hover { border-color: #3a4a63; background: #1b2536; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.sm { height: 30px; padding: 0 10px; font-size: 12.5px; border-radius: 8px; }
.btn.em { background: var(--em); border-color: var(--em); color: #04130d; } .btn.em:hover { background: #14cf91; }
.btn.rd { background: rgba(239,68,68,.12); border-color: rgba(239,68,68,.45); color: #fca5a5; } .btn.rd:hover { background: rgba(239,68,68,.22); }
.btn.or { background: rgba(249,115,22,.12); border-color: rgba(249,115,22,.45); color: #fdba74; }
.btn.bl { background: rgba(59,130,246,.12); border-color: rgba(59,130,246,.45); color: #93c5fd; }
.btn.ghost { background: transparent; }
.bd { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--rd); color: #fff; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; }
.bd.or { background: var(--or); } .bd.z { display: none; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 99px; font-size: 12px; font-weight: 650; background: var(--card2); border: 1px solid var(--line2); color: var(--mu); white-space: nowrap; }
.chip.rd { color: #fca5a5; border-color: rgba(239,68,68,.4); background: rgba(239,68,68,.1); }
.chip.or { color: #fdba74; border-color: rgba(249,115,22,.4); background: rgba(249,115,22,.1); }
.chip.em { color: #6ee7b7; border-color: rgba(16,185,129,.4); background: rgba(16,185,129,.1); }
.chip.bl { color: #93c5fd; border-color: rgba(59,130,246,.4); background: rgba(59,130,246,.1); }
.chip.pu { color: #c4b5fd; border-color: rgba(139,92,246,.4); background: rgba(139,92,246,.1); }
.seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--bg2); border: 1px solid var(--line); border-radius: 11px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 8px; color: var(--mu); font-weight: 650; cursor: pointer; font-size: 13px; }
.seg button.on { background: var(--card2); color: var(--tx); box-shadow: 0 1px 0 var(--line2) inset; }
.inp { height: 38px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line2); background: var(--bg2); outline: none; width: 100%; }
.inp:focus { border-color: var(--em); box-shadow: 0 0 0 3px rgba(16,185,129,.15); }
textarea.inp { height: auto; min-height: 70px; padding: 10px 12px; resize: vertical; }
.lbl { font-size: 12px; color: var(--mu); font-weight: 650; margin: 0 0 6px; display: block; }
.row { display: flex; align-items: center; gap: 10px; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.av { width: 40px; height: 40px; border-radius: 12px; background: var(--card2); border: 1px solid var(--line2); display: inline-flex; align-items: center; justify-content: center; font-weight: 800; color: var(--mu); overflow: hidden; flex: none; }
.av img { width: 100%; height: 100%; object-fit: cover; }
.av.lg { width: 64px; height: 64px; border-radius: 18px; font-size: 22px; }
.av.sm { width: 28px; height: 28px; border-radius: 8px; font-size: 12px; }
.link { cursor: pointer; text-decoration: none; } .link:hover { text-decoration: underline; }
.empty { padding: 48px 20px; text-align: center; color: var(--mu); }
.empty .i { font-size: 34px; color: var(--em); margin-bottom: 8px; }
.sk { background: linear-gradient(90deg, var(--card) 0, var(--card2) 50%, var(--card) 100%); background-size: 200% 100%; animation: sk 1.2s infinite; border-radius: var(--r); }
@keyframes sk { to { background-position: -200% 0; } }
.list > * + * { border-top: 1px solid var(--line); }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.kv > div { background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.kv b { display: block; font-size: 18px; } .kv span { font-size: 11.5px; color: var(--mu); }
table.t { width: 100%; border-collapse: collapse; }
table.t th { text-align: left; font-size: 11.5px; font-weight: 700; color: var(--mu); padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t tr:last-child td { border-bottom: 0; }
table.t tr.click { cursor: pointer; } table.t tr.click:hover td { background: rgba(255,255,255,.02); }
.tw { overflow-x: auto; }
h2.h { font-size: 15px; margin: 26px 0 10px; display: flex; align-items: center; gap: 8px; }
h2.h .muted { font-weight: 500; font-size: 13px; }

/* stats */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.stat { padding: 16px; position: relative; overflow: hidden; }
.stat .k { font-size: 12px; color: var(--mu); font-weight: 650; display: flex; align-items: center; gap: 6px; }
.stat .v { font-size: 30px; font-weight: 850; letter-spacing: -.5px; margin-top: 4px; }
.stat .s { font-size: 12px; color: var(--mu); }
.stat.hot { border-color: rgba(249,115,22,.5); background: linear-gradient(160deg, rgba(249,115,22,.12), var(--card) 60%); cursor: pointer; }
.stat.hot2 { border-color: rgba(239,68,68,.5); background: linear-gradient(160deg, rgba(239,68,68,.12), var(--card) 60%); cursor: pointer; }
.bars { display: flex; align-items: flex-end; gap: 5px; height: 110px; padding-top: 10px; }
.bars div { flex: 1; background: linear-gradient(180deg, var(--em), rgba(16,185,129,.35)); border-radius: 5px 5px 2px 2px; min-height: 3px; position: relative; }
.bars.bl div { background: linear-gradient(180deg, var(--bl), rgba(59,130,246,.35)); }
.bars div:hover::after { content: attr(data-t); position: absolute; bottom: 100%; left: 50%; transform: translate(-50%, -6px); background: #000; padding: 3px 7px; border-radius: 6px; font-size: 11px; white-space: nowrap; }
.bars-x { display: flex; justify-content: space-between; font-size: 11px; color: var(--mu2); margin-top: 6px; }

/* review card */
.rv { display: grid; grid-template-columns: 1.1fr 1fr; gap: 0; overflow: hidden; }
.rv + .rv { margin-top: 12px; }
.rv > * { min-width: 0; }
.rv .l { padding: 16px; border-right: 1px solid var(--line); }
.stats.two { grid-template-columns: 1fr 1fr; }
.rv .r { padding: 16px; background: var(--bg2); }
.big { font-size: 34px; font-weight: 900; letter-spacing: -1px; line-height: 1; }
.ratio { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; width: 74px; height: 74px; border-radius: 18px; font-weight: 900; font-size: 22px; flex: none; }
.ratio small { font-size: 10px; font-weight: 700; opacity: .8; }
.ratio.hi { background: rgba(239,68,68,.14); color: #fca5a5; border: 1px solid rgba(239,68,68,.4); }
.ratio.mid { background: rgba(249,115,22,.14); color: #fdba74; border: 1px solid rgba(249,115,22,.4); }
.ratio.ok { background: rgba(16,185,129,.12); color: #6ee7b7; border: 1px solid rgba(16,185,129,.35); }
.hist { display: flex; align-items: flex-end; gap: 4px; height: 64px; margin: 8px 0 4px; }
.hist div { flex: 1; border-radius: 4px 4px 1px 1px; background: rgba(139,152,174,.35); min-height: 3px; position: relative; }
.hist div.me { background: var(--or); }
.hist div:hover::after { content: attr(data-t); position: absolute; bottom: 100%; left: 50%; transform: translate(-50%, -6px); background: #000; padding: 3px 7px; border-radius: 6px; font-size: 11px; white-space: nowrap; z-index: 2; }
.act { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }

/* report / post */
.rp { padding: 16px; } .rp + .rp { margin-top: 12px; }
.prev { background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-top: 12px; }
.prev img, .prev video { max-width: 100%; max-height: 340px; border-radius: 10px; display: block; margin-top: 8px; background: #000; }
.posts { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.post { overflow: hidden; display: flex; flex-direction: column; }
.post .media { background: #000; aspect-ratio: 4/3; display: flex; align-items: center; justify-content: center; }
.post .media img, .post .media video { width: 100%; height: 100%; object-fit: cover; }
.post .b { padding: 12px; flex: 1; display: flex; flex-direction: column; gap: 8px; }
.post.hidden { opacity: .55; }
.note { white-space: pre-wrap; word-break: break-word; }

/* player */
.ph { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; padding: 18px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 18px 0 12px; }
.tabs button { border: 1px solid var(--line); background: var(--card); color: var(--mu); border-radius: 99px; padding: 6px 13px; font-weight: 650; cursor: pointer; font-size: 13px; }
.tabs button.on { color: var(--tx); border-color: var(--em); background: rgba(16,185,129,.1); }
tr.sus td { background: rgba(249,115,22,.06); }
tr.bad td { background: rgba(239,68,68,.07); }

/* modal, toast, login */
.mbg { position: fixed; inset: 0; background: rgba(3,6,10,.72); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; animation: fi .15s; }
.modal { width: 100%; max-width: 460px; max-height: 90vh; overflow: auto; background: var(--card); border: 1px solid var(--line2); border-radius: 18px; padding: 20px; box-shadow: var(--sh); animation: up .18s; }
.modal h3 { margin: 0 0 4px; font-size: 18px; }
@keyframes fi { from { opacity: 0; } } @keyframes up { from { transform: translateY(10px); opacity: 0; } }
.fld { margin-top: 14px; }
.toasts { position: fixed; right: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 60; }
.toast { background: #0d1320; border: 1px solid var(--line2); border-left: 3px solid var(--em); border-radius: 10px; padding: 10px 14px; box-shadow: var(--sh); max-width: 360px; animation: up .18s; }
.toast.err { border-left-color: var(--rd); }
.login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: radial-gradient(800px 400px at 50% -10%, rgba(16,185,129,.15), transparent), var(--bg); }
.login .card { width: 100%; max-width: 380px; padding: 26px; }
.login img { width: 56px; height: 56px; border-radius: 15px; }
.or-line { display: flex; align-items: center; gap: 10px; color: var(--mu2); font-size: 12px; margin: 14px 0; } .or-line::before, .or-line::after { content: ""; flex: 1; height: 1px; background: var(--line); }
pre.code { background: #070a0f; border: 1px solid var(--line); border-radius: 10px; padding: 12px; overflow-x: auto; font-size: 12px; white-space: pre-wrap; word-break: break-all; }
.rules-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
.rules-grid label { display: flex; align-items: center; gap: 8px; background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 6px 6px 12px; font-size: 13px; }
.rules-grid label span { flex: 1; } .rules-grid input { width: 74px; height: 32px; }
.sw { position: relative; width: 42px; height: 24px; border-radius: 99px; background: var(--line2); border: 0; cursor: pointer; flex: none; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: .15s; }
.sw.on { background: var(--em); } .sw.on::after { left: 21px; }

@media (max-width: 980px) { .stats { grid-template-columns: repeat(2, 1fr); } .rv { grid-template-columns: 1fr; } .rv .l { border-right: 0; border-bottom: 1px solid var(--line); } }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  .side { display: none; }
  .main { padding: 16px 16px 96px; }
  .bnav { display: flex; position: fixed; left: 0; right: 0; bottom: 0; background: rgba(15,20,29,.96); backdrop-filter: blur(8px); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); z-index: 40; overflow-x: auto; }
  .stats.two { grid-template-columns: 1fr; }
  .bnav button { flex: 1; min-width: 0; letter-spacing: -.2px; white-space: nowrap; border: 0; background: none; color: var(--mu); font-size: 9.5px; font-weight: 650; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 2px; position: relative; cursor: pointer; }
  .bnav button .i { font-size: 20px; }
  .bnav button.on { color: var(--em); }
  .bnav .bd { position: absolute; top: 0; left: 50%; margin-left: 6px; height: 17px; min-width: 17px; font-size: 10px; }
  .top h1 { font-size: 19px; }
  .stat .v { font-size: 24px; }
  .hide-sm { display: none; }
  .toasts { left: 12px; right: 12px; bottom: 80px; }
}
</style>
</head>

'use strict';

function reviewCard(r) {
  const ratio = r.ratio != null ? +r.ratio : null, prev = +r.prev_best || 0, jump = prev ? Math.round((r.e1rm / prev - 1) * 100) : null;
  const hist = (r.history || []).slice().reverse(); if (!hist.some(h => h.id === r.lift_id || Math.abs(h.e1rm - r.e1rm) < 0.6)) hist.push({ id: r.lift_id, date: r.lift_date || 'сейчас', weight: r.weight || r.e1rm, reps: r.reps || 1, e1rm: +r.e1rm });
  const mx = Math.max(1, ...hist.map(h => +h.e1rm || 0), +r.e1rm);
  const st = { pending: ['or', 'ждёт проверки'], approved: ['em', 'одобрен'], rejected: ['rd', 'отклонён'] }[r.status] || ['', r.status];
  const accDays = r.account_created ? Math.floor((Date.now() - new Date(r.account_created)) / 864e5) : null;
  return `<div class="card rv" data-rv="${esc(r.id)}">
    <div class="l">
      <div class="row wrap" style="margin-bottom:14px">${av(r)}<div class="grow"><a class="link" data-user style="font-weight:800">${esc(r.nickname || 'без ника')}</a> ${r.banned ? '<span class="chip rd">бан</span>' : ''} ${r.trusted ? '<span class="chip em">проверенный</span>' : ''}<div class="muted" style="font-size:12px">${esc(r.email || '')} · аккаунту ${accDays == null ? '?' : accDays} дн</div></div><span class="chip ${st[0]}">${st[1]}</span></div>
      <div class="row" style="align-items:flex-start;gap:16px">
        ${ratio != null ? `<div class="ratio ${(r.reasons || []).includes('ratio') ? 'hi' : ratioCls(ratio)}">${ratio.toFixed(1)}×<small>веса тела</small></div>` : ''}
        <div class="grow">
          <div class="muted" style="font-weight:700">${esc(exRu(r.ex))} ${r.kind && r.kind !== 'other' && !EX[r.ex] ? `<span class="chip">${esc(r.kind)}</span>` : ''}</div>
          <div class="big num" style="margin:4px 0">${r.weight ? `${fmt(r.weight)} <span style="font-size:16px" class="muted">кг × ${r.reps || 1}</span>` : `${fmt(r.e1rm)} <span style="font-size:16px" class="muted">кг e1RM</span>`}</div>
          <div class="muted" style="font-size:13px">e1RM <b class="num" style="color:var(--tx)">${kg(r.e1rm)}</b> · вес тела <b class="num" style="color:var(--tx)">${kg(r.bodyweight)}</b> · был рекорд <b class="num" style="color:var(--tx)">${prev ? kg(prev) : 'нет'}</b>${jump != null ? ` <span class="chip ${jump > 15 ? 'or' : ''}">+${jump}%</span>` : ''}</div>
        </div>
      </div>
      <div class="row wrap" style="gap:6px;margin-top:12px">${(r.reasons || []).map(x => `<span class="chip ${(WHY[x] || ['', ''])[0]}">${esc((WHY[x] || ['', x])[1])}</span>`).join('')}<span class="chip">${r.source === 'app' ? 'из приложения' : r.source === 'scan' ? 'найден сканом' : 'найден сервером'}</span><span class="chip">${dt(r.created_at)}</span></div>
      ${r.status === 'pending' ? `<input class="inp" data-note placeholder="Комментарий игроку (необязательно)" style="margin-top:14px">
      <div class="act"><button class="btn em" data-ok>${ic('check')} Одобрить</button><button class="btn rd" data-no>${ic('x')} Отклонить</button><button class="btn ghost" data-noban>${ic('ban')} Отклонить и забанить</button></div>`
      : `<div class="muted" style="margin-top:12px;font-size:13px">${r.decided_nick ? `Решение: ${esc(r.decided_nick)}, ` : ''}${dt(r.decided_at)}${r.note ? ` · «${esc(r.note)}»` : ''}</div>`}
    </div>
    <div class="r">
      <div class="muted" style="font-size:12px;font-weight:700">История упражнения, e1RM <span style="color:var(--or)">■ этот подход</span></div>
      ${hist.length ? `<div class="hist">${hist.map(h => `<div class="${h.id === r.lift_id || Math.abs(h.e1rm - r.e1rm) < 0.6 ? 'me' : ''}" style="height:${Math.max(4, h.e1rm / mx * 100)}%" data-t="${esc(h.date)}: ${fmt(h.weight)}×${h.reps} = ${fmt(h.e1rm)}"></div>`).join('')}</div><div class="bars-x"><span>${esc(hist[0].date)}</span><span>${esc(hist[hist.length - 1].date)}</span></div>` : '<div class="muted" style="font-size:13px;margin:10px 0">Нет истории этого упражнения в приложении</div>'}
      <div class="kv" style="margin-top:12px;grid-template-columns:repeat(3,1fr)">
        <div><b class="num">${fmt(r.trophies)}</b><span>кубков</span></div>
        <div><b class="num" style="color:${r.rejected_total ? '#fca5a5' : 'inherit'}">${fmt(r.rejected_total)}</b><span>отклонено раньше</span></div>
        <div><b class="num" style="color:${r.reports_total ? '#fdba74' : 'inherit'}">${fmt(r.reports_total)}</b><span>жалоб</span></div>
      </div>
      ${r.bests && Object.keys(r.bests).length ? `<div class="muted" style="font-size:12px;font-weight:700;margin-top:12px">Рекорды в профиле</div><div class="row wrap" style="gap:6px;margin-top:6px">${Object.entries(r.bests).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([e, val]) => `<span class="chip">${esc(exRu(e))}: <b class="num" style="color:var(--tx)">${fmt(val)}</b></span>`).join('')}</div>` : ''}
    </div>
  </div>`;
}

VIEWS.reports = async (v, alive) => {
  const tab = S.tabs.reports;
  const head = topbar('Жалобы', `<div class="seg" id="rt">${[['new', 'Новые'], ['closed', 'Закрытые'], ['all', 'Все']].map(([k, t]) => `<button data-t="${k}" class="${tab === k ? 'on' : ''}">${t}</button>`).join('')}</div>`);
  v.innerHTML = head + loading(3, 160);
  const bind = () => v.querySelectorAll('#rt button').forEach(b => b.onclick = () => { S.tabs.reports = b.dataset.t; render(); });
  bind();
  const rows = await rpc('admin_reports', { p_status: tab, p_limit: 100 }); if (!alive()) return;
  if (!rows.length) { v.innerHTML = head + `<div class="card empty">${ic('flag')}<div style="font-weight:700;color:var(--tx)">${tab === 'new' ? 'Новых жалоб нет' : 'Пусто'}</div></div>`; bind(); return; }
  v.innerHTML = head + rows.map(reportCard).join(''); bind();
  v.querySelectorAll('[data-rp]').forEach(card => {
    const g = rows.find(x => x.target_id === card.dataset.rp), t = g.target || {};
    const resolve = async (action, label) => {
      if (action === 'delete' && !(await confirmBox('Удалить навсегда?', 'Это нельзя отменить.', 'Удалить'))) return;
      try { await act(() => rpc('admin_report_resolve', { p_target: g.target_id, p_action: action, p_note: '' }), label); await refreshStats(); render(); } catch (_) {}
    };
    card.querySelectorAll('[data-a]').forEach(b => b.onclick = () => resolve(b.dataset.a, b.dataset.l));
    const bb = card.querySelector('[data-ban]'); if (bb) bb.onclick = async () => { if (await banModal(t.author, t.author_nick, g.items.some(i => i.reason === 'cheat') ? 'Накрутка результатов' : g.items.some(i => i.reason === 'abuse') ? 'Оскорбления' : '')) { await rpc('admin_report_resolve', { p_target: g.target_id, p_action: g.target_kind === 'user' ? 'ok' : 'hide', p_note: 'бан' }).catch(() => {}); await refreshStats(); render(); } };
    const ub = card.querySelector('[data-user]'); if (ub) ub.onclick = () => go('player', t.author);
  });
};
function reportCard(g) {
  const t = g.target, kinds = { user: ['Игрок', 'users'], post: ['Пост', 'img'], comment: ['Комментарий', 'list'] }, k = kinds[g.target_kind] || ['?', 'flag'];
  const counts = {}; g.items.forEach(i => counts[i.reason] = (counts[i.reason] || 0) + 1);
  let preview = '<div class="prev muted">Уже удалено</div>';
  if (t && g.target_kind === 'post') {
    const img = safeImg(t.photo), vid = safeUrl(t.video);
    preview = `<div class="prev">${t.hidden ? '<span class="chip or" style="margin-bottom:8px">скрыт</span> ' : ''}${t.kind === 'pr' ? `<span class="chip pu">рекорд: ${esc(exRu(t.ex))} ${fmt(t.weight)} кг × ${t.reps || 1}</span>` : ''}<div class="note" style="margin-top:6px">${esc(t.body) || '<span class="muted">без текста</span>'}</div>${img ? `<img src="${esc(img)}" alt="" loading="lazy">` : ''}${vid ? `<video src="${esc(vid)}" controls preload="metadata" playsinline></video>` : ''}<div class="muted" style="font-size:12px;margin-top:8px">${dt(t.created_at)} · ${fmt(t.likes)} лайков</div></div>`;
  } else if (t && g.target_kind === 'comment') {
    preview = `<div class="prev">${t.hidden ? '<span class="chip or">скрыт</span> ' : ''}<div class="note">${esc(t.body)}</div><div class="muted" style="font-size:12px;margin-top:6px">${dt(t.created_at)}</div></div>`;
  } else if (t && g.target_kind === 'user') {
    preview = `<div class="prev"><div class="row">${av(t)}<div class="grow"><b>${esc(t.author_nick)}</b>${t.title ? ` <span class="muted">«${esc(t.title)}»</span>` : ''}<div class="muted" style="font-size:12px">${fmt(t.trophies)} кубков</div></div></div>${t.bests && Object.keys(t.bests).length ? `<div class="row wrap" style="gap:6px;margin-top:10px">${Object.entries(t.bests).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([e, val]) => `<span class="chip">${esc(exRu(e))}: <b class="num" style="color:var(--tx)">${fmt(val)}</b></span>`).join('')}</div>` : ''}</div>`;
  }
  const isUser = g.target_kind === 'user';
  return `<div class="card rp" data-rp="${esc(g.target_id)}">
    <div class="row wrap"><span class="chip ${g.open ? 'rd' : ''}">${ic(k[1])} ${k[0]}</span>${t ? `<a class="link" data-user style="font-weight:800">${esc(t.author_nick || '?')}</a>` : ''}<div class="grow"></div><span class="chip ${g.n >= 3 ? 'rd' : 'or'}">${g.n} ${plural(g.n, 'жалоба', 'жалобы', 'жалоб')}</span><span class="muted" style="font-size:12px">${ago(g.last_at)}</span></div>
    <div class="row wrap" style="gap:6px;margin-top:10px">${Object.entries(counts).map(([r, n]) => `<span class="chip ${r === 'cheat' ? 'or' : r === 'abuse' || r === 'nsfw' ? 'rd' : ''}">${esc(REASON[r] || r)}${n > 1 ? ` ×${n}` : ''}</span>`).join('')}</div>
    ${g.items.filter(i => i.note).slice(0, 4).map(i => `<div class="muted" style="font-size:13px;margin-top:8px">«${esc(i.note)}» <span class="mu2">— ${esc(i.reporter_nick || 'игрок')}</span></div>`).join('')}
    ${preview}
    ${g.open ? `<div class="act">
      ${!isUser && t ? `<button class="btn or" data-a="hide" data-l="Скрыто">${ic('eye-off')} Скрыть</button><button class="btn rd" data-a="delete" data-l="Удалено">${ic('trash')} Удалить</button>` : ''}
      ${t ? `<button class="btn rd" data-ban>${ic('ban')} Забанить ${isUser ? '' : 'автора'}</button>` : ''}
      <button class="btn" data-a="${isUser ? 'ok' : 'dismiss'}" data-l="Закрыто">${ic('check')} ${isUser ? 'Проверено, всё ок' : 'Жалобы ложные'}</button>
      ${t ? `<button class="btn ghost" data-user>${ic('users')} Профиль</button>` : ''}
    </div>` : `<div class="muted" style="font-size:13px;margin-top:10px">Закрыто: ${esc(g.resolution || '')}</div>`}
  </div>`;
}

  });
  v.querySelectorAll('[data-reset]').forEach(b => b.onclick = async () => { if (await resetModal(p.id, p.nickname, b.dataset.reset, +b.dataset.v)) render(); });
};
function logDetails(l) {
  const d = l.details || {};
  if (l.action.startsWith('review')) return `${exRu(d.ex)} ${fmt(d.e1rm)} кг${d.note ? ` · ${d.note}` : ''}`;
  if (l.action === 'ban') return `${d.days ? d.days + ' дн' : 'навсегда'}${d.reason ? ' · ' + d.reason : ''}`;
  if (l.action.startsWith('adjust')) return `${d.mode === 'set' ? '= ' : d.amount > 0 ? '+' : ''}${fmt(d.amount)}${d.note ? ' · ' + d.note : ''}`;
  if (l.action === 'reset_ex') return `${exRu(d.ex)} → ${fmt(d.max)} кг`;
  if (l.action === 'scan') return `найдено ${fmt(d.found)}`;
  if (l.action === 'note') return d.note || '';
  return '';
}

  const add = v.querySelector('[data-add]'); if (add) add.onclick = async () => {
    const q = v.querySelector('#tq').value.trim(); if (!q) return;
    const found = await rpc('admin_players', { p_q: q, p_filter: 'all', p_limit: 5, p_offset: 0 });
    const p = found.find(x => (x.nickname || '').toLowerCase() === q.toLowerCase() || (x.email || '').toLowerCase() === q.toLowerCase()) || (found.length === 1 ? found[0] : null);
    if (!p) return toast(found.length ? 'Нашлось несколько игроков: введи точный ник или email' : 'Игрок не найден', true);
    if (await confirmBox('Сделать модератором?', `<b>${esc(p.nickname)}</b> (${esc(p.email || '')}) сможет проверять подходы, жалобы и банить игроков.`, 'Сделать модератором', 'em')) { await act(() => rpc('admin_team_set', { p_user: p.id, p_on: true }), 'Добавлен').catch(() => {}); render(); }
  };
};

/* ---------- вход ---------- */
function loginView(msg = '') {
  $('#root').innerHTML = `<div class="login"><div class="card">
    <div class="row" style="margin-bottom:18px"><img src="../icon.png" alt=""><div><div style="font-size:19px;font-weight:850">Flexo League</div><div class="muted">Админ-панель</div></div></div>
    <form id="lf"><label class="lbl">Email</label><input class="inp" id="le" type="email" autocomplete="username" required autofocus>
    <label class="lbl" style="margin-top:12px">Пароль</label><input class="inp" id="lp" type="password" autocomplete="current-password" required>
    <button class="btn em" style="width:100%;margin-top:16px;height:42px">Войти</button></form>
    <div class="or-line">или</div>
    <button class="btn" id="lg" style="width:100%;height:42px"><svg class="i" viewBox="0 0 24 24" style="stroke:none"><path fill="#EA4335" d="M12 10.2v3.9h5.5c-.2 1.3-1.6 3.8-5.5 3.8-3.3 0-6-2.7-6-6.1s2.7-6.1 6-6.1c1.9 0 3.1.8 3.8 1.5l2.6-2.5C16.8 3.2 14.6 2.2 12 2.2 6.6 2.2 2.2 6.6 2.2 12s4.4 9.8 9.8 9.8c5.7 0 9.4-4 9.4-9.6 0-.6-.1-1.1-.2-1.6H12z"/></svg> Войти через Google</button>
    <div id="lm" style="margin-top:14px;font-size:13px;color:#fca5a5">${esc(msg)}</div>
    <div class="muted" style="font-size:12px;margin-top:10px">Тот же аккаунт, что и в приложении. Доступ только у админов.</div>
  </div></div>`;
  $('#lf').onsubmit = async e => { e.preventDefault(); $('#lm').textContent = ''; const { error } = await sb.auth.signInWithPassword({ email: $('#le').value.trim(), password: $('#lp').value }); if (error) { $('#lm').textContent = /Invalid login/i.test(error.message) ? 'Неверный email или пароль' : error.message; return; } boot(); };
  $('#lg').onclick = async () => { const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname, queryParams: { prompt: 'select_account' } } }); if (error) $('#lm').textContent = error.message; };
}
function noAccess(me) {
  const sql = `insert into public.admins(user_id, role) values ('${me.uid}', 'owner')\non conflict (user_id) do update set role = 'owner';`;
  $('#root').innerHTML = `<div class="login"><div class="card" style="max-width:520px">
    <div style="font-size:19px;font-weight:850">${ic('shield')} Нет доступа</div>
    <div class="muted" style="margin:8px 0 14px">Ты вошёл как <b style="color:var(--tx)">${esc(me.email || me.nick || '')}</b>, но этот аккаунт не админ.</div>
    <div style="font-size:13px">Если это твой проект: открой Supabase → SQL Editor и выполни (один раз):</div>
    <pre class="code" style="margin-top:8px">${esc(sql)}</pre>
    <div class="row" style="margin-top:12px"><button class="btn" data-copy="${esc(sql)}">${ic('copy')} Скопировать</button><button class="btn em" onclick="location.reload()">${ic('refresh')} Я выполнил</button><div class="grow"></div><button class="btn ghost" data-logout>${ic('out')} Выйти</button></div>
  </div></div>`;
}
async function boot() {
  const { data } = await sb.auth.getSession();
  if (!data.session) return loginView();
  let me;
  try { me = await rpc('admin_me'); } catch (e) { return loginView(errText(e)); }
  if (!me || !me.is_admin) return noAccess(me || {});
  S.me = me; parseHash(); await refreshStats(); render();
  setInterval(async () => { const before = S.stats && S.stats.pending_reviews + S.stats.new_reports; await refreshStats(); const now = S.stats && S.stats.pending_reviews + S.stats.new_reports; if (now !== before) document.querySelectorAll('.nav, .bnav button').forEach(n => { const k = n.dataset.go, c = k === 'reviews' ? S.stats.pending_reviews : k === 'reports' ? S.stats.new_reports : 0; let b = n.querySelector('.bd'); if (k === 'reviews' || k === 'reports') { if (!b && c) { b = document.createElement('span'); b.className = 'bd' + (k === 'reviews' ? ' or' : ''); n.appendChild(b); } if (b) { b.textContent = c || ''; b.classList.toggle('z', !c); } } }); document.title = (now ? `(${now}) ` : '') + 'Flexo Admin'; }, 60000);
}
sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') loginView(); });
boot();
</script>
